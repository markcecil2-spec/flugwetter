<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5a46">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Kalkulatte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Werkbank-App – Kopfleiste mit Reitern; Übersicht = Artikeltabelle mit Monatsergebnis; Artikel = Eingaben links, Ergebnis-Zettel rechts (sticky) */
:root {
  --bg: #f3f1ec;          /* Birkensperrholz */
  --panel: #fbfaf7;
  --line: #ddd8cd;
  --fg: #23201b;
  --muted: #6c665b;
  --accent: #2f5a46;      /* Werkstattgrün */
  --accent-soft: #dfe9e2;
  --on-accent: #fbfaf7;
  --walnut: #7a4b2a;
  --good: #2e7d4f; --warn: #b7791f; --bad: #b3412f;
  --seg-vat: #a8a195; --seg-fee: #c9813f; --seg-make: #7a4b2a; --seg-ship: #4f7896; --seg-pack: #9c8a6b; --seg-time: #8a6fa3; --seg-other: #7d7d7d; --seg-profit: #2e7d4f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1916; --panel: #23221e; --line: #3a372f; --fg: #ece8df; --muted: #a39d90;
  --accent: #7fb89a; --accent-soft: #24342b; --on-accent: #1a1916; --walnut: #c99467;
  --good: #5cbf85; --warn: #e0a84a; --bad: #e07a66;
  --seg-vat: #6f6a60; --seg-fee: #d89452; --seg-make: #b07a4f; --seg-ship: #6d9cc0; --seg-pack: #b3a17f; --seg-time: #a68cc0; --seg-other: #8f8f8f; --seg-profit: #5cbf85;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a1916; --panel: #23221e; --line: #3a372f; --fg: #ece8df; --muted: #a39d90;
  --accent: #7fb89a; --accent-soft: #24342b; --on-accent: #1a1916; --walnut: #c99467;
  --good: #5cbf85; --warn: #e0a84a; --bad: #e07a66;
  --seg-vat: #6f6a60; --seg-fee: #d89452; --seg-make: #b07a4f; --seg-ship: #6d9cc0; --seg-pack: #b3a17f; --seg-time: #a68cc0; --seg-other: #8f8f8f; --seg-profit: #5cbf85;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0 }
h1 { font-size: 1.6rem; letter-spacing: -0.01em }
h2 { font-size: 1.15rem }
h3 { font-size: 1rem }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.note { font-size: .8rem; color: var(--muted); margin: 0 }
.ph { color: var(--warn); font-size: .8rem; margin: 0 }
.reco { font-size: .78rem; color: var(--muted); margin-top: 4px; white-space: nowrap }
.reco-big { margin: 4px 0 0; font-size: .95rem } .reco-big strong { color: var(--accent); font-size: 1.1rem }
.inp.est, .inp.need, .inp.changed { box-shadow: 0 0 0 2px var(--warn) }
table.ov td.name, table.ov th.selcol + th { text-align: left }
.selcol { width: 34px; padding-right: 0 }
.selstack { display: flex; flex-direction: column; align-items: center; gap: 4px }
.selstack .star { padding: 0; font-size: 1.05rem } .selcol input { width: 18px; height: 18px; accent-color: var(--accent) }
tr.selected td { background: var(--accent-soft) }
.cmp { margin: 10px 0; gap: 10px }
.cmp .row { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.cmp h3 { margin: 0 }
.cmptable { min-width: 0 }
.cmptable th, .cmptable td { padding: 6px 10px; vertical-align: top }
.cmptable th { text-transform: none; letter-spacing: 0; font-size: .9rem }
.cmptable tbody th { text-align: left; font-weight: 500; color: var(--muted); white-space: nowrap }
.cmptable .cmp-art { text-align: left; min-width: 150px; max-width: 220px; white-space: normal; font-weight: 600 }
.cmptable .cmp-art .thumb { float: none; display: block; margin: 0 0 6px; width: 56px; height: 56px }
.cmptable .cmp-sec th { padding-top: 14px; color: var(--fg); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em }
.cmptable tr.total th, .cmptable tr.total td { font-weight: 700; color: var(--fg) }
.cmptable tr.total td.best { color: var(--good) }
.cmptable td.best { color: var(--good); font-weight: 700 }
.linkbtn { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
.linkbtn:hover { text-decoration-color: currentColor }
.suptable th, .suptable td { text-align: left; vertical-align: top }
.colpick { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; display: grid; gap: 10px; background: var(--bg) }
.colpick-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.colpick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem }
.switch input { position: absolute; opacity: 0; pointer-events: none }
.switch .track { width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; flex: none; transition: background .15s }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s }
.switch input:checked + .track { background: var(--accent) }
.switch input:checked + .track::after { transform: translateX(16px) }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px }
table.ov td, table.ov th { white-space: nowrap }
table.ov td.name { white-space: normal; min-width: 260px }
.abc { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700; border: 1.5px solid currentColor; font-size: .85rem }
.abc.sm { width: 20px; height: 20px; font-size: .72rem }
.abc-A { color: var(--good) } .abc-B { color: var(--warn) } .abc-C { color: var(--muted) }
.rmbtn { font: 500 .78rem var(--font-body); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap }
.rmbtn:hover { border-color: var(--bad); color: var(--bad) }
.rmbtn.on { border-color: var(--bad); background: var(--bad); color: #fff }
tr.rmrow td:not(:first-child) { opacity: .6 }
.chip.rm { color: var(--bad); font-weight: 600 }
.anatable th, .anatable td { text-align: left; vertical-align: top; padding: 6px 10px; white-space: normal }
.anatable td.num, .anatable th.r { white-space: nowrap }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
@media (max-width: 760px) { .tiles.t3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.anatable th.r, .anatable td.r { text-align: right }
.anabar { display: block; height: 8px; min-width: 90px; border-radius: 4px; background: var(--line); overflow: hidden }
.anabar i { display: block; height: 100%; border-radius: 4px }
.anagrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.navbadge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--warn); color: #fff; font-size: .72rem; font-weight: 700; line-height: 18px; text-align: center }
.ordtable th, .ordtable td { text-align: left; vertical-align: top; padding-left: 8px; padding-right: 8px }
.ordtable tr.orddone td { opacity: .55 }
.ordline { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-width: 240px; max-width: 460px }
.ordline > div { flex: 1; min-width: 0 }
.ordline .thumb { float: none; width: 36px; height: 36px; margin: 0; flex: none }
.ordline select { width: 100%; max-width: 100%; font: inherit; font-size: .85rem; padding: 4px 6px; border: 1px solid var(--warn); border-radius: 6px; background: var(--bg); color: inherit }
.ordqty { font-weight: 700; white-space: nowrap }
.ordtable input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent) }
.prodtable th, .prodtable td { text-align: left; vertical-align: middle; white-space: nowrap }
.prodtable td.name { white-space: normal; min-width: 190px }
.prodtable .thumb { float: none; display: block; width: 52px; height: 52px; margin: 0; border-radius: 8px }
.prodtable .inp { max-width: 190px }
.prodtable .inp.qprice { width: 112px }
.prodtable .inp.qprice input { font-size: 1.05rem }
.prodtable .inp.qprice input[type=number]::-webkit-inner-spin-button { opacity: 1; height: 26px; cursor: pointer }
tr.prodon td { background: var(--accent-soft) }
tr.prodon [data-q="prod"] { font-weight: 700 }
#printArea { display: none }
@media print {
  body > *:not(#printArea) { display: none !important }
  #printArea { display: block !important; padding: 8px; color: #000; background: #fff }
  #printArea h1 { font: 700 20px sans-serif; margin: 0 0 12px }
  #printArea table { border-collapse: collapse; width: 100% }
  #printArea th, #printArea td { border: 1px solid #888; padding: 6px 8px; font: 14px sans-serif; text-align: left; vertical-align: middle }
  #printArea img { width: 56px; height: 56px; object-fit: cover; float: none; display: block }
  #printArea .chk { font-size: 22px; text-align: center } #printArea .qty { font: 700 20px sans-serif; text-align: center }
  #printArea tr { break-inside: avoid }
}
.supbars { display: grid; gap: 12px }
.supbar { display: grid; gap: 4px }
.supbar-head { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem }
.supbar-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.supbar-track div { height: 100%; background: var(--accent); border-radius: 4px }
.selbar { position: sticky; top: calc(var(--toph, 60px) + 8px); z-index: 5; background: var(--panel); box-shadow: 0 4px 14px rgb(0 0 0 / .08); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; margin: 10px 0; border: 1px solid var(--accent); border-radius: 10px }
.selbar.danger { border-color: var(--bad) }
.selbar.danger .note { flex: 1 }
.bulkbox { margin: 10px 0; border-color: var(--accent) }
.inp textarea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 9px 10px; font: .95rem var(--font-body); outline: none; resize: vertical }
.todo-box { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line) }
.todo-note { margin-top: 4px; font-size: .82rem; color: var(--warn); white-space: normal }
.stabs { margin: 4px 0 14px } .stackset { max-width: 760px }
.chmini { font: inherit; font-size: .8rem; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit }
.inp.chsel { display: inline-flex; width: auto; max-width: 100%; margin-bottom: 10px }
label.check { margin-top: 10px; font-weight: 600 }
label.check small { font-weight: 400; color: var(--muted) }

/* Kopfleiste */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
.top .wrap { grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0 }
.logo { width: 34px; height: 34px; border-radius: 8px; flex: none; display: block }
.brand strong { font-family: var(--font-display); font-size: 1.05rem; white-space: nowrap }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .9rem; padding: 6px 12px; border-radius: 999px }
nav.tabs a[aria-current=page] { background: var(--accent-soft); color: var(--accent) }
/* Kalkulator links, Betrieb (Bestellungen, Produktion, Support) rechts davon, durch einen Strich getrennt */
.navsep { align-self: center; width: 1px; height: 20px; background: var(--line); margin: 0 14px }
.sync { font-size: .75rem; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good) }
.sync.saving .dot { background: var(--warn) } .sync.err .dot { background: var(--bad) }
@media (max-width: 720px) {
  .top .wrap { grid-template-columns: 1fr auto; row-gap: 6px }
  nav.tabs { grid-column: 1 / -1; justify-content: flex-start; order: 3 }
  .navsep { display: none }
}
main.wrap { padding-block: 20px 48px }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start }
.stack { display: grid; gap: 18px; min-width: 0 }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr) } }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px }
@media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr) } .grid3.keep { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.field { display: grid; gap: 4px; min-width: 0; align-content: start }
.field label { font-size: .82rem; color: var(--muted) }
.field small { color: var(--muted); font-size: .74rem }
.inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.inp input, .inp select { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 9px 10px; font: 500 .95rem var(--font-mono); outline: none }
.inp input[type=text], .inp input[type=search], .inp select { font-family: var(--font-body) }
.inp span { padding: 0 10px; color: var(--muted); font-size: .85rem }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button, .btn { font: 500 .85rem var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 7px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.seg button[aria-pressed=true], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn:hover, .seg button:hover { border-color: var(--accent) }
.btn:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.check { display: flex; gap: 8px; align-items: center; font-size: .88rem }
.check input { accent-color: var(--accent); width: 16px; height: 16px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between }
.btns { display: flex; gap: 8px; flex-wrap: wrap }

/* Zeilenlisten */
.rows { display: grid; gap: 8px }
.rowhead, .rowline { display: grid; gap: 8px; align-items: center }
.rowhead { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.rowline .inp input, .rowline .inp select { padding: 7px 8px; font-size: .88rem }
.rowline .out { font-family: var(--font-mono); font-size: .85rem; text-align: right; color: var(--muted) }
.c-parts, .c-extra { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) 32px }
.c-2 { grid-template-columns: minmax(0, 2.5fr) minmax(0, 1.2fr) 32px }
.c-plates { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, .8fr) 32px }
.c-ship { grid-template-columns: minmax(0, 2fr) repeat(5, minmax(0, 1fr)) 32px }
.c-small { grid-template-columns: minmax(0, 2.5fr) minmax(0, 1fr) minmax(0, 1fr) 32px }
.c-mach { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)) 32px }
.c-blank { grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)) 32px }
.c-box { grid-template-columns: minmax(0, 2fr) repeat(5, minmax(0, 1fr)) 32px }
.rowline.chosen .inp:first-child { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.rows .inp span { padding: 0 6px 0 0; font-size: .75rem }
.x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem }
.x:hover { color: var(--bad); border-color: var(--bad) }
.add { justify-self: start; font-size: .82rem; padding: 5px 12px }
.sumline { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; font-size: .88rem }
.sumline strong { font-family: var(--font-mono); font-weight: 500 }
/* Listen stapeln, sobald ihre Box schmal ist (Handy, aber auch die halbe Desktop-Spalte) */
.rows { container-type: inline-size }
@container (max-width: 640px) {
  .rowhead.c-extra { display: none }
  .rowline.c-extra { grid-template-columns: repeat(3, minmax(0, 1fr)) 32px; grid-template-areas: "n n n x" "p g q ."; padding-bottom: 8px; border-bottom: 1px dashed var(--line) }
  .rowline.c-extra > :nth-child(1) { grid-area: n } .rowline.c-extra > :nth-child(2) { grid-area: p } .rowline.c-extra > :nth-child(3) { grid-area: g } .rowline.c-extra > :nth-child(4) { grid-area: q } .rowline.c-extra > :nth-child(5) { grid-area: x; justify-self: end }
  .rowhead.c-parts, .rowhead.c-ship, .rowhead.c-plates, .rowhead.c-box, .rowhead.c-blank { display: none }
  .rowline.c-parts, .rowline.c-ship, .rowline.c-plates, .rowline.c-box, .rowline.c-blank { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 8px; border-bottom: 1px dashed var(--line) }
  .rowline.c-ship > :first-child, .rowline.c-plates > :first-child, .rowline.c-box > :first-child { grid-column: 1 / -1 }
  .rowhead.c-mach, .rowhead.c-small { display: none }
  .rowline.c-small { grid-template-columns: repeat(2, minmax(0, 1fr)) 32px; grid-template-areas: "n n x" "p g ."; padding-bottom: 8px; border-bottom: 1px dashed var(--line) }
  .rowline.c-small > :nth-child(1) { grid-area: n } .rowline.c-small > :nth-child(2) { grid-area: p } .rowline.c-small > :nth-child(3) { grid-area: g } .rowline.c-small > :nth-child(4) { grid-area: x; justify-self: end }
  .rowline.c-mach { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "n n x" "r a s"; padding-bottom: 8px; border-bottom: 1px dashed var(--line) }
  .rowline.c-mach > :nth-child(1) { grid-area: n } .rowline.c-mach > :nth-child(2) { grid-area: r } .rowline.c-mach > :nth-child(3) { grid-area: a }
  .rowline.c-mach > :nth-child(4) { grid-area: s } .rowline.c-mach > :nth-child(5) { grid-area: x; justify-self: end }
  .rowline.c-plates { grid-template-areas: "n n x" "p l b" }
  .rowline.c-plates > :nth-child(1) { grid-area: n } .rowline.c-plates > :nth-child(2) { grid-area: p } .rowline.c-plates > :nth-child(3) { grid-area: l }
  .rowline.c-plates > :nth-child(4) { grid-area: b } .rowline.c-plates > :nth-child(5) { grid-area: x; justify-self: end }
  .rowline.c-blank { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-areas: "n n n x" "l h t m" }
  .rowline.c-blank > :nth-child(1) { grid-area: n } .rowline.c-blank > :nth-child(2) { grid-area: l } .rowline.c-blank > :nth-child(3) { grid-area: h }
  .rowline.c-blank > :nth-child(4) { grid-area: t } .rowline.c-blank > :nth-child(5) { grid-area: m } .rowline.c-blank > :nth-child(6) { grid-area: x; justify-self: end }
  .rowline.c-box { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "n n x" "l b h" "g p p" }

          <div class="field"><label for="ana-hours">Wie viele Stunden pro Woche könntest du maximal bauen?</label>${numIn('id="ana-hours" data-ana="anaHours"', S.anaHours ?? "", "Std")}<small>Damit rechnet die App die Kapazität.</small></div>
        </div>
        ${realH > 0 ? `<p>Bei <strong>${dec(realH, 0)} Std pro Woche</strong> brauchst du in Wahrheit <strong>${dec(minReal, 0)} Min pro Stück</strong> (statt ${dec(avgMin, 0)}). Dein Gewinn pro Stunde ist dann <strong>${eur(realPerH)}</strong>${realPerH < v(S.rate) ? ", <strong>unter deinem Stundensatz von " + eur(v(S.rate)) + "</strong>" : ""}.</p>` : `<p class="note">Trag oben deine echten Wochenstunden ein: Dann siehst du, was du wirklich pro Stunde verdienst und wie viel Luft du hast.</p>`}

        <div class="anagrid">
          <div><h3>Bester Stundenlohn</h3>${anaTable(["Artikel", "pro Std"], best.map(x => [anaName(x.a), eur0(x.wage)]), [1])}</div>

        ${anaTable(["Kanal", "Stück/Monat", "Anteil"], Object.entries(T.byCh).sort((a, b) => b[1] - a[1]).map(([k, q]) => [esc(CH_NAMES[k] || k), dec(q, 0), pct(q / T.qty * 100)]), [1, 2])}

      <section class="box" style="margin-top:12px"><h2>Bestellungen und Service</h2>
        ${pace.length ? `<p class="note">Aktuelles Tempo laut Reiter „Bestellungen“, hochgerechnet auf 30 Tage. Zum Vergleich der Schnitt aus deinem Import.</p>${anaTable(["Quelle", "Bestellungen seit", "Bestellungen", "Stück", "Stück pro Monat (hochgerechnet)", "Schnitt im Import"], pace.map(x => [esc(x.name), esc(x.from.split("-").reverse().join(".")) + ` (${x.days} Tage)`, x.n, x.pcs, `<strong>${dec(x.perMonth, 0)}</strong>`, dec(T.byCh[x.ch] || 0, 0)]), [2, 3, 4, 5])}${pace.some(x => x.days < 25) ? `<p class="note">Wo erst wenige Tage in der Liste stehen, ist die Hochrechnung grob.</p>` : ""}${pace.some(x => T.byCh[x.ch] && x.perMonth < T.byCh[x.ch] * 0.75) ? `<p style="color:var(--warn)"><strong>Achtung:</strong> Das aktuelle Tempo liegt bei mindestens einer Quelle deutlich unter dem Schnitt im Import. Dann ist das Monatsergebnis oben eher zu optimistisch. Prüf deine Etsy-Statistik der letzten Wochen.</p>` : ""}` : `<p class="note">Noch keine Bestellungen im Reiter „Bestellungen“.</p>`}
        <p>Reklamationen: <strong>${recl}</strong> in den letzten 30 Tagen (${dec(reclRate, 1)} % der Verkäufe), insgesamt ${reclAll} erfasst, teils aus der Oktober-Auswertung. Mit grob 12 € pro Fall (Porto, Teile, Zeit) sind das <strong>${eur0(reclCost)} pro Monat</strong>. Häufigste Ursachen stehen im Reiter „Support“.</p>
      </section>`;
  }

  // ---------- Bestellungen: Shopify (direkt) und Etsy (aus den Bestätigungsmails in Gmail) ----------
  let ORD = [];
  let ord = { f: "open", busy: false, msg: "", err: "", ask: "" };
  const MONTHS = { jan: 0, feb: 1, mär: 2, mar: 2, apr: 3, mai: 4, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, okt: 9, oct: 9, nov: 10, dez: 11, dec: 11 };
  const deNum = x => { const f = parseFloat(String(x || "").replace(/\./g, "").replace(",", ".")); return isFinite(f) ? f : 0; };
  const decEnt = x => { const t = document.createElement("textarea"); t.innerHTML = x; return t.value; };
  const ordArt = id => A.find(a => a.id === id);
  const lineLabel = a => a.name.split(" · ").slice(1).join(" ");
  const ordKey = (title, variant) => normTitle(title) + "|" + normTitle(variant);
  const ordOpen = o => o.status === "offen";
  const ordPcs = o => (o.lines || []).reduce((n, l) => n + v(l.qty), 0);
  function ordBadge() {
    const el = $("ordBadge"); if (!el) return; const n = ORD.filter(ordOpen).length;
    el.textContent = n || ""; el.hidden = !n;
  }
  // Artikel zu einer SKU; bei mehreren Varianten mit gleicher SKU entscheidet der Variantentext
  function ordResolve(sku, variant) {
    const c = sku ? A.filter(a => a.sku && norm(a.sku) === norm(sku)) : []; if (!c.length) return null;
    if (c.length === 1) return c[0];
    const vt = normTitle(variant), hit = c.filter(a => { const l = normTitle(lineLabel(a)); return l && vt && (vt.includes(l) || l.includes(vt)); });
    return (hit.length ? hit : c)[0];
  }
  // offen bestellte Stückzahl je Artikel
  function ordDemand() {
    const d = {}; ORD.filter(ordOpen).forEach(o => (o.lines || []).forEach(l => { if (l.aid) d[l.aid] = (d[l.aid] || 0) + v(l.qty); }));
    return d;
  }
  const mcpErr = (server, e) => ({
    no_mcp: "Die Verbindung geht nur in der App auf claude.ai.",
    server_not_connected: server + " ist nicht verbunden: claude.ai → Einstellungen → Connectors hinzufügen.",
    needs_reauth: server + " neu verbinden: claude.ai → Einstellungen → Connectors.",
    not_in_manifest: "Du hast den Zugriff auf " + server + " für diese App abgelehnt.",
    approval_required: "Der Zugriff auf " + server + " braucht deine Freigabe. Nochmal klicken und erlauben.",
    tool_error: server + " meldet einen Fehler: " + (e && e.message || ""),
    server_unavailable: server + " ist gerade nicht erreichbar, bitte gleich nochmal versuchen."
  }[e && e.code] || "Fehler bei " + server + ": " + (e && (e.message || e.code) || "unbekannt"));
  async function gmail(tool, input) {
    const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
    if (!mcp) throw { code: "no_mcp" };
    const res = await mcp.callTool("Gmail", tool, input, { cache: false });
    return res.payload && typeof res.payload === "object" ? res.payload : {};
  }

  // Etsy-Bestätigungsmail → Bestellung (ohne Namen und Adresse; nur Land)
  function ordParseEtsy(th) {
    const m = (th.messages || [])[0] || {}, body = m.plaintextBody || m.plaintext_body || "", subj = m.subject || "";
    const no = (subj.match(/Bestellung Nr\.\s*(\d+)/) || body.match(/Bestellnummer:\s*(\d+)/) || [])[1]; if (!no) return null;
    const at = String(m.date || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    let shipBy = "";
    const sb = subj.match(/Versand bis\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{1,2})/);
    if (sb && MONTHS[sb[1].slice(0, 3).toLowerCase()] !== undefined) {
      const mon = MONTHS[sb[1].slice(0, 3).toLowerCase()], day = +sb[2], base = new Date(at + "T00:00:00");
      let y = base.getFullYear(); if (new Date(y, mon, day) < new Date(base.getTime() - 30 * 864e5)) y++;
      shipBy = `${y}-${String(mon + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    const lines = [], re = /Transaktions-Nr\.:\s*\d+\s*\n\s*Artikel:[ \t]*([^\n]*)\n([\s\S]*?)St(?:ü|&uuml;)ckzahl:\s*(\d+)\s*\n\s*Artikelpreis:\s*([\d.,]+)/g;
    let x; while ((x = re.exec(body))) {
      const variant = x[2].split("\n").map(t => decEnt(t).trim()).filter(Boolean).join(" · ");
      lines.push({ sku: "", title: decEnt(x[1]).trim(), variant, qty: +x[3], price: deNum(x[4]), aid: "" });
    }
    if (!lines.length) return null;
    const tot = body.match(/Gesamtsumme[^:\n]*:\s*([\d.,]+)/) || subj.match(/\[([\d.,]+)\s*€/);
    return { id: "etsy-" + no, src: "etsy", no, at, shipBy, total: tot ? deNum(tot[1]) : 0, country: decEnt((body.match(/country-name'>([^<]+)</) || [])[1] || "").trim(), status: "offen", lines, thread: m.threadId || th.id || "" };
  }

  function ordUpsertShopify(n) {
    const no = String(n.name || "").replace(/\D/g, ""); if (!no) return 0;
    const id = "shop-" + no, old = ORD.find(o => o.id === id);
    const done = n.displayFulfillmentStatus === "FULFILLED";
    const o = { id, src: "shopify", no: "#" + no, at: String(n.createdAt || "").slice(0, 10), shipBy: "", total: v(((n.totalPriceSet || {}).shopMoney || {}).amount),
      country: (n.shippingAddress || {}).countryCodeV2 || "", manual: old ? !!old.manual : false,
      status: n.cancelledAt ? "storniert" : done ? "erledigt" : (old && old.manual ? old.status : "offen"),
      lines: ((n.lineItems || {}).nodes || []).map(l => { const a = ordResolve(l.sku, l.variantTitle); return { sku: l.sku || "", title: l.title || "", variant: l.variantTitle || "", qty: l.quantity || 0, price: v(((l.originalUnitPriceSet || {}).shopMoney || {}).amount), aid: a ? a.id : "" }; }) };
    if (old && JSON.stringify(old) === JSON.stringify(o)) return 0;
    const i = ORD.findIndex(x => x.id === id); if (i >= 0) ORD[i] = o; else ORD.push(o);
    saveOrder(o); return old ? 0 : 1;
  }

  // Etsy-Positionen den Artikeln zuordnen: gemerkte Zuordnung, sonst Claude (Vorschlag, in der Liste korrigierbar)
  async function ordMapEtsy() {
    S.ordMap = S.ordMap || {};
    const info = { err: "", unmapped: 0 };
    // früher falsch gelesen: leerer Titel, dann stand die Variante im Titel
    ORD.forEach(o => { if (o.src === "etsy") o.lines.forEach(l => { if (!l.aid && l.title && !/\|/.test(l.title) && /^[^:]{1,40}:\s/.test(l.title) && l.title.length < 70) { l.variant = l.title + (l.variant ? " · " + l.variant : ""); l.title = ""; saveOrder(o); } }); });
    const open = []; ORD.forEach(o => o.lines.forEach((l, i) => { if (!l.aid && o.src === "etsy") open.push([o, i, l]); }));
    const changed = new Set();
    open.forEach(([o, i, l]) => { const id = S.ordMap[ordKey(l.title, l.variant)]; if (id && ordArt(id)) { l.aid = id; l.sku = ordArt(id).sku || ""; changed.add(o); } });
    const rest = open.filter(([o, i, l]) => !l.aid), keys = [...new Set(rest.map(([o, i, l]) => ordKey(l.title, l.variant)))];
    if (keys.length) {
      const sample = await getSample();
      if (sample) {
        const first = {}; rest.forEach(([o, i, l]) => { first[ordKey(l.title, l.variant)] = l; });
        const arts = A.map((a, i) => `${i}|${a.sku || "-"}|${a.name}|${v(a.price) ? dec(v(a.price), 0) + " €" : "?"}`).join("\n");
        const pos = keys.map((k, i) => `${i}|${first[k].title || "(ohne Titel)"} | ${first[k].variant} | ${dec(v(first[k].price), 0)} €`).join("\n");
        try {
          const r = await sample.json(`Ordne jede Etsy-Bestellposition dem passenden Artikel aus der Liste zu. Die Position besteht aus dem Etsy-Angebotstitel (oft englisch) und der gewählten Variante (Größe, Hakenzahl, Farbe, Gravur). Der Titel steht in der Sprache des Käufers (englisch, französisch …), die Artikelnamen sind deutsch. Die Variante nennt Breite/Länge in cm (z. B. „Width: 70 Centimeters“, „Breite/Gravur: 40 cm - 7 Haken“), Hakenzahl und Gravur. Die Hakenfarbe (Schwarz, Silber, Gold) ignorierst du. Fehlt der Titel, entscheiden Größe, Hakenzahl und Preis. Der Preis ist der Etsy-Preis pro Stück und passt meist zum Artikelpreis. Gib nur dann einen Artikel an, wenn Produkt UND Größe passen. Sonst null.

ARTIKEL (Nr|SKU|Name|Preis):
${arts}

POSITIONEN (Nr|Angebotstitel | Variante | Preis pro Stück):
${pos}

Antworte NUR mit JSON: {"0": <Artikelnummer oder null>, "1": ...}. Schlüssel = Nummer der Position.`, { modelTier: "default", cache: { gcTime: 600000 } });
          keys.forEach((k, i) => { const idx = r && r[String(i)]; const a = Number.isInteger(idx) ? A[idx] : null; if (a) S.ordMap[k] = a.id; });
          saveSettings();
          rest.forEach(([o, i, l]) => { const id = S.ordMap[ordKey(l.title, l.variant)]; if (id && ordArt(id)) { l.aid = id; l.sku = ordArt(id).sku || ""; changed.add(o); } });
        } catch (e) { info.err = supErr(e).replace(/\.$/, ""); }
      } else info.err = "Claude ist hier nicht verfügbar";
    }
    changed.forEach(saveOrder);
    info.unmapped = ORD.reduce((n, o) => n + (o.src === "etsy" && ordOpen(o) ? o.lines.filter(l => !l.aid).length : 0), 0);
    return info;
  }

  // Ab wann gesucht wird: erster Lauf nach Wahl (heute oder x Tage zurück), danach ab dem letzten Lauf (2 Tage Überlappung, bekannte Bestellungen werden eh übersprungen)
  const isoDay = t => new Date(t).toISOString().slice(0, 10);
  function ordSince(daysBack) {
    if (daysBack !== undefined) return isoDay(Date.now() - daysBack * 864e5);
    const last = S.ordLast || ORD.filter(o => o.src === "etsy").map(o => o.at).sort().pop() || "";
    return isoDay(last ? new Date(last + "T00:00:00").getTime() - 2 * 864e5 : Date.now() - 30 * 864e5);
  }
  async function ordSync(daysBack) {
    if (ord.busy) return;
    ord.busy = true; ord.err = ""; ord.msg = "Shopify wird gelesen …"; renderOrders();
    const errs = []; let nNew = 0;
    try {
      // Shopify: neue Bestellungen plus alle noch offenen (damit „versendet“ ankommt)
      const oldestOpen = ORD.filter(o => o.src === "shopify" && o.status === "offen").map(o => o.at).sort()[0] || "9999";
      const sinceE = ordSince(daysBack), since = oldestOpen < sinceE ? oldestOpen : sinceE; let after = null;
      for (let page = 0; page < 8; page++) {
        const d = await shopify("graphql_query", { query: "query($first:Int!,$after:String,$q:String){ orders(first:$first, after:$after, query:$q, sortKey:CREATED_AT, reverse:true){ pageInfo{ hasNextPage endCursor } nodes{ name createdAt displayFulfillmentStatus cancelledAt totalPriceSet{ shopMoney{ amount } } shippingAddress{ countryCodeV2 } lineItems(first:50){ nodes{ sku title variantTitle quantity originalUnitPriceSet{ shopMoney{ amount } } } } } } }", first: 50, variables: { first: 50, after, q: "created_at:>=" + since } });
        const os = d.orders; if (!os) throw { code: "tool_error", message: "Unerwartete Antwort" };
        os.nodes.forEach(n => { nNew += ordUpsertShopify(n); });
        if (!os.pageInfo.hasNextPage) break; after = os.pageInfo.endCursor;
      }
    } catch (e) { errs.push("Shopify: " + mcpErr("Shopify", e)); }
    try {
      ord.msg = "Etsy-Mails werden gesucht …"; renderOrders();
      const threads = []; let tok = "";
      for (let page = 0; page < 4; page++) {
        const r = await gmail("search_threads", { query: `from:transaction@etsy.com subject:"Bestellung Nr." after:${ordSince(daysBack).replace(/-/g, "/")}`, pageSize: 50, ...(tok ? { pageToken: tok } : {}), view: "THREAD_VIEW_MINIMAL" });
        (r.threads || []).forEach(t => threads.push(t)); tok = r.nextPageToken || ""; if (!tok) break;
      }
      const fresh = threads.filter(t => { const sj = ((t.messages || [])[0] || {}).subject || ""; const no = (sj.match(/Bestellung Nr\.\s*(\d+)/) || [])[1]; return no && !ORD.some(o => o.id === "etsy-" + no); });
      for (let i = 0; i < fresh.length; i++) {
        ord.msg = `Etsy-Bestellmails lesen … ${i + 1} von ${fresh.length}`; renderOrders();
        const th = await gmail("get_thread", { threadId: fresh[i].id, messageFormat: "PLAIN_TEXT" });
        const o = ordParseEtsy(th); if (o && !ORD.some(x => x.id === o.id)) { ORD.push(o); saveOrder(o); nNew++; }
      }
    } catch (e) { errs.push("Etsy/Gmail: " + mcpErr("Gmail", e)); }
    let mapInfo = { err: "", unmapped: 0 };
    try { ord.msg = "Artikel werden zugeordnet …"; renderOrders(); mapInfo = await ordMapEtsy(); } catch (e) { mapInfo.err = "Zuordnung fehlgeschlagen"; }
    if (mapInfo.err) errs.push("Automatische Zuordnung: " + mapInfo.err + ". Bitte unten per Auswahl zuordnen.");
    else if (mapInfo.unmapped) errs.push(mapInfo.unmapped + " Position" + (mapInfo.unmapped > 1 ? "en" : "") + " nicht sicher zuzuordnen (z. B. Titel fehlt oder Variante mehrdeutig). Bitte unten per Auswahl zuordnen, die App merkt es sich.");

    ord.msg = errs.length && !nNew ? "" : (nNew ? nNew + " neue Bestellung" + (nNew > 1 ? "en" : "") + " geholt." : "Keine neuen Bestellungen.");

  }

  function renderOrders() {
    const all = ORD.slice().sort((a, b) => (b.at || "").localeCompare(a.at || "") || String(b.no).localeCompare(String(a.no), "de", { numeric: true }));
    const live = all.filter(o => o.status !== "storniert"), open = live.filter(ordOpen), done = live.filter(o => o.status === "erledigt");
    const list = ord.f === "all" ? live : ord.f === "done" ? done : open, today = new Date().toISOString().slice(0, 10);
    const pcs = open.reduce((n, o) => n + ordPcs(o), 0), arts = [...A].sort((x, y) => (norm(x.sku) || "~").localeCompare(norm(y.sku) || "~", "de", { numeric: true }));
    const lineHTML = (o, l, i) => { const a = ordArt(l.aid);
      return `<div class="ordline">${a ? thumbHTML(a) : ""}<div>${a ? `<strong class="num">${esc(a.sku || "")}</strong> <span class="note">${esc(a.name)}</span>`
        : `<select data-ordmap="${o.id}:${i}" aria-label="Artikel zuordnen"><option value="">⚠ Artikel zuordnen …</option>${arts.map(x => `<option value="${x.id}">${esc((x.sku || "–") + " · " + x.name)}</option>`).join("")}</select>`}
        <div class="note">${esc(l.variant || "")}${a ? "" : (l.title ? " · " + esc(l.title.slice(0, 70)) : " · (Titel fehlt in der Etsy-Mail)") + " · " + eur(v(l.price))}</div></div><span class="ordqty num">× ${dec(v(l.qty), 0)}</span></div>`; };
    $("view").innerHTML = `
      <div class="row"><h1>Bestellungen</h1>${ORD.length || S.ordLast ? `<button type="button" class="btn primary" data-act="ordSync" ${ord.busy ? "disabled" : ""}>${ord.busy ? "Lade …" : "↻ Neue Bestellungen holen"}</button>`
        : `<div class="btns"><button type="button" class="btn primary" data-act="ordSyncNew" ${ord.busy ? "disabled" : ""}>Nur neue ab heute</button><button type="button" class="btn" data-act="ordSync30" ${ord.busy ? "disabled" : ""}>Letzte 30 Tage holen</button></div>`}</div>
      <p class="note">Shopify wird direkt gelesen, Etsy aus den Bestätigungsmails in deinem Gmail (Absender transaction@etsy.com). Gespeichert werden nur Bestellnummer, Datum, Land, Artikel und Betrag, keine Namen oder Adressen. Die App holt immer nur Bestellungen, die sie noch nicht kennt${S.ordLast ? " (zuletzt geholt: " + esc(S.ordLast.split("-").reverse().join(".")) + ")" : ""}.</p>
      ${ord.msg ? `<p class="note" style="color:var(--fg)"><strong>${esc(ord.msg)}</strong></p>` : ""}${ord.err ? `<p class="note" style="color:var(--bad)">${esc(ord.err)}</p>` : ""}
      <section class="box">
        <div class="row"><strong>${open.length} offen · ${dec(pcs, 0)} Stück</strong>
          <div class="seg" aria-label="Anzeige">${[["open", "Offen (" + open.length + ")"], ["done", "Erledigt (" + done.length + ")"], ["all", "Alle"]].map(([k, l]) => `<button type="button" data-ordf="${k}" aria-pressed="${ord.f === k}">${l}</button>`).join("")}</div></div>
        <p class="note">Etsy verrät in den Mails nicht, ob schon verschickt ist: hak erledigte Bestellungen selbst ab. Shopify-Bestellungen setzen sich von allein auf erledigt, sobald sie dort versendet sind.</p>
        ${list.length && ord.f === "open" ? `<div class="btns"><button type="button" class="btn" data-act="ordAllDone">Alle ${list.length} angezeigten als erledigt markieren</button></div>` : ""}
        ${ord.ask ? `<div class="selbar danger" style="position:static"><strong>${list.length} Bestellungen als erledigt markieren?</strong><span class="btns"><button class="btn primary" data-act="ordYes">Ja</button><button class="btn" data-act="ordNo">Abbrechen</button></span></div>` : ""}
        <div class="tablewrap"><table class="ordtable"><thead><tr><th>✓</th><th>Datum</th><th>Bestellung</th><th>Artikel</th><th>Land</th><th>Versand bis</th><th>Betrag</th></tr></thead>
        <tbody>${list.map(o => `<tr class="${o.status === "erledigt" ? "orddone" : ""}">

  const syncErr = e => ({
    no_mcp: "Die Shopify-Verbindung geht nur in der App auf claude.ai.",
    server_not_connected: "Shopify ist nicht verbunden: in claude.ai unter Einstellungen → Connectors hinzufügen.",

    not_in_manifest: "Du hast den Zugriff auf Shopify für diese App abgelehnt.",

    tool_error: "Shopify hat einen Fehler gemeldet: " + (e && e.message || ""),

  }[e && e.code] || "Fehler bei Shopify: " + (e && (e.message || e.code) || "unbekannt"));
  async function syncLoad() {
    sync = { state: "loading", rows: [], unmatched: [], msg: "", pick: new Set() }; renderPrices();
    try {
      const vars = []; let after = null;
      for (let page = 0; page < 40; page++) {
        const d = await shopify("graphql_query", { query: "query($first:Int!,$after:String){ productVariants(first:$first, after:$after){ pageInfo{ hasNextPage endCursor } nodes{ id sku price title product{ id title status } } } }", first: 50, variables: { first: 50, after } });
        const pv = d.productVariants; if (!pv) throw { code: "tool_error", message: "Unerwartete Antwort" };
        vars.push(...pv.nodes); if (!pv.pageInfo.hasNextPage) break; after = pv.pageInfo.endCursor;
      }
      const bySku = {};
      vars.forEach(x => { const k = norm(x.sku); if (k) (bySku[k] = bySku[k] || []).push(x); });
      const rows = [], unmatched = [];
      A.filter(a => v(a.price) > 0).forEach(a => {

        if (c.length > 1) { const lab = normTitle(a.name.split(" · ").slice(1).join(" ")); const hit = c.filter(x => normTitle(x.title) === lab); c = hit.length === 1 ? hit : c.filter(x => lab && normTitle(x.title).includes(lab)); }
        if (c.length !== 1) { if (a.sku || (a.source === "shopify")) unmatched.push(a); return; }
        const vt = c[0], neu = shopPrice(a), old = v(vt.price);
        if (Math.abs(neu - old) > 0.004) rows.push({ a, vid: vt.id, pid: vt.product.id, old, neu });
      });

      sync = { state: "idle", rows, unmatched, pick: new Set(rows.map((_, i) => i)), msg: `${vars.length} Varianten aus Shopify geladen. ${rows.length ? rows.length + " Preise weichen ab." : "Alle gefundenen Preise stimmen schon."}` };
    } catch (e) { sync = { state: "idle", rows: [], unmatched: [], pick: new Set(), msg: syncErr(e) }; }

  async function syncApply() {
    const picked = sync.rows.filter((_, i) => sync.pick.has(i)); if (!picked.length) return;
    sync.state = "saving"; renderPrices();
    const byProduct = {}; picked.forEach(x => (byProduct[x.pid] = byProduct[x.pid] || []).push(x));

    for (const [pid, list] of Object.entries(byProduct)) {

        const ue = d.productVariantsBulkUpdate && d.productVariantsBulkUpdate.userErrors || [];
        if (ue.length) errs.push(list[0].a.name + ": " + ue.map(u => u.message).join(", ")); else ok += list.length;
      } catch (e) { errs.push(list[0].a.name + ": " + syncErr(e)); if (e && ["no_mcp", "server_not_connected", "needs_reauth", "not_in_manifest"].includes(e.code)) break; }

  function packOptions(a) {
    const parts = (a.parts || []).filter(p => v(p.l) * v(p.b) > 0);
    if (!parts.length) return [];
    const th = p => v(((S.blanks || []).find(b => b.n === p.blank) || {}).t) || 2;
    const sort = d => d.sort((x, y) => y - x);
    if (parts.length === 1) {
      const p = parts[0], n = Math.max(1, Math.round(v(p.q))), out = [];
      for (let k = 1; k <= n; k++) {
        const h = Math.ceil(n / k) * th(p);
        out.push(sort([k * v(p.l), v(p.b), h]), sort([v(p.l), k * v(p.b), h]));
      }
      return out;
    }
    const t = parts.reduce((s, p) => s + th(p) * Math.max(1, v(p.q)), 0);
    return [sort([Math.max(...parts.map(p => v(p.l))), Math.max(...parts.map(p => v(p.b))), t])];

  }

      return opts.some(need => need.every((n, i) => n <= inner[i]));
    });
    const cost = b => { const r = pickShip({ ...a, pkL: b.l, pkB: b.b, pkH: b.h, shipMode: "auto" }); return v(b.p) + (r.best ? r.best.price : 99); };

  // ---------- CSV-Import ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((x, y) => y[1] - x[1])[0][0];
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim() !== ""));
  }
  function money(s) {

    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return new Date(yr(m[3]), m[1] - 1, +m[2]); // Etsy: MM/DD/YY

        const seen = {};

      ${imp.files.map((F, fi) => `<section class="box">
        <div class="row"><h2>${esc(F.file)}</h2><span class="pill ${F.error ? "bad" : "good"}">${esc(F.fmt.label)}</span></div>
        ${F.fmt.type === "generic" || (F.error && F.fmt.type !== "etsyOrders") ? `<div class="grid3 keep">${["name", "qty", "price", "date"].map(k => `<div class="field"><label>${{ name: "Artikelname", qty: "Menge", price: "Preis pro Stück", date: "Datum" }[k]}</label><div class="inp"><select data-imap="${fi}" data-k="${k}">${opt("-1", "–", F.map[k] < 0)}${F.rawHdr.map((h, i) => opt(String(i), h, F.map[k] === i)).join("")}</select></div></div>`).join("")}
          <div class="field"><label>Kanal</label><div class="inp"><select data-ich="${fi}">${CHANNELS.map(c => opt(c, CH_NAMES[c], F.ch === c)).join("")}</select></div></div></div>` : ""}
        ${F.error ? `<p class="warn">${esc(F.error)}</p>` : `
          ${F.groups[0] && !F.groups[0].product ? `<div class="grid3 keep" style="align-items:end"><div class="field"><span class="label">Zeitraum</span><span class="num">${fd(F.from)} – ${fd(F.to)}</span></div>
            <div class="field"><label for="imon-${fi}">Entspricht Monaten</label>${numIn(`id="imon-${fi}" data-imon="${fi}"`, F.months, "Mon.")}</div>
            <div class="field"><span class="label">Verkauft gesamt</span><span class="num">${dec(F.groups.reduce((s, x) => s + x.qty, 0), 0)} Stk</span></div></div>` : `<p class="note">Produktliste: übernimmt Preise${F.fmt.type === "shopifyProducts" ? " und Gewichte" : ""}, keine Verkaufszahlen.</p>`}
          <div class="tablewrap"><table class="imp"><thead><tr><th>Gefunden</th><th>${F.groups[0] && F.groups[0].product ? "" : "Stk"}</th><th>Ø Preis</th><th>Zuordnung</th></tr></thead><tbody>
            ${F.groups.map((g, gi) => `<tr><td class="name">${esc(g.name)}</td><td class="num">${g.product ? "" : dec(g.qty, 0)}</td><td class="num">${eur(g.avg)}</td>
              <td><div class="inp" style="min-width:0"><select data-itgt="${fi}" data-g="${gi}" aria-label="Zuordnung für ${esc(g.name)}">${artOpts(g.target)}</select></div></td></tr>`).join("")}
          </tbody></table></div>`}
      </section>`).join("")}
      <p class="note">Mehrere Zeilen auf denselben Artikel legen fasst sie zusammen (z. B. Varianten). Bei jedem Artikel merkt sich die App den Namen aus dem Import und ordnet ihn beim nächsten Mal automatisch zu.</p>`;
    $("splitVar").addEventListener("change", e => { imp.split = e.target.checked; imp.files.forEach(F => F.groups = []); analyze(); renderImportPreview(); });
    document.querySelectorAll("[data-itgt]").forEach(s => s.addEventListener("change", () => { imp.files[+s.dataset.itgt].groups[+s.dataset.g].target = s.value; }));
    document.querySelectorAll("[data-imon]").forEach(s => s.addEventListener("input", () => { imp.files[+s.dataset.imon].months = v(s.value) || 1; }));
    document.querySelectorAll("[data-imap]").forEach(s => s.addEventListener("change", () => { const F = imp.files[+s.dataset.imap]; F.map[s.dataset.k] = +s.value; F.groups = []; F.months = null; analyze(); renderImportPreview(); }));
    document.querySelectorAll("[data-ich]").forEach(s => s.addEventListener("change", () => { imp.files[+s.dataset.ich].ch = s.value; }));
  }
  function applyImport() {
    let created = 0, updated = new Set();
    const acc = {};   // Artikel-ID → Kanal → Summen
    const newByKey = {};
    imp.files.forEach(F => {
      if (F.error) return;
      F.groups.forEach(g => {
        if (g.target === "skip") return;
        let a;
        if (g.target === "new") {
          a = newByKey[g.key];
          if (!a) {
            a = { ...ARTICLE_BLANK(), name: g.name, chan: F.ch, price: isFinite(g.avg) ? g.avg.toFixed(2) : "", aliases: [g.name], sku: g.sku || "" };
            if (isFinite(g.grams) && g.grams > 0) a.weight = String(Math.round(g.grams));
            A.push(a); newByKey[g.key] = a; created++;
          }
        } else {
          a = A.find(x => x.id === g.target); if (!a) return;
          if (norm(a.name) !== g.key && !(a.aliases || []).some(al => norm(al) === g.key)) (a.aliases = a.aliases || []).push(g.name);
          if (g.sku && !a.sku) a.sku = g.sku;
          if (g.product) { if (isFinite(g.avg)) a.price = g.avg.toFixed(2); if (isFinite(g.grams) && g.grams > 0 && !v(a.weight)) a.weight = String(Math.round(g.grams)); }
          updated.add(a.id);
        }
        if (g.product) return;
        const k = acc[a.id] = acc[a.id] || {};
        const c = k[F.ch] = k[F.ch] || { qty: 0, revenue: 0, priced: 0, months: 0, from: null, to: null };
        c.qty += g.qty; c.revenue += g.revenue; c.priced += g.priced || 0; c.months = Math.max(c.months, v(F.months) || 1);
        if (F.from && (!c.from || F.from < c.from)) c.from = F.from;
        if (F.to && (!c.to || F.to > c.to)) c.to = F.to;
      });
    });
    // Ein neuer Import ersetzt die Verkaufszahlen des Kanals bei allen Artikeln
    const chans = new Set(imp.files.filter(F => !F.error && F.groups.some(g => !g.product)).map(F => F.ch));
    A.forEach(a => {
      let ch = updated.has(a.id) || Object.values(newByKey).includes(a);
      chans.forEach(c => { if (a.sales && a.sales[c]) { delete a.sales[c]; ch = true; } });
      Object.entries(acc[a.id] || {}).forEach(([c, x]) => {
        (a.sales = a.sales || {})[c] = { qty: x.qty, months: x.months, avg: x.priced ? Math.round(x.revenue / x.priced * 100) / 100 : v(a.price),
          from: x.from ? x.from.toISOString().slice(0, 10) : "", to: x.to ? x.to.toISOString().slice(0, 10) : "" };
        ch = true;
      });
      if (ch) saveArticle(a);
    });
    imp = null;
    toast(`${created} Artikel neu angelegt, ${updated.size} aktualisiert`);
    go("uebersicht");
  }

  // ---------- Live-Abgleich ----------
  function liveArticles(changes) {
    if (!changes.length) return;
    changes.forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === "removed") { A = A.filter(a => a.id !== id); return; }
      const d = clone(ch.doc.data() || {}), i = A.findIndex(a => a.id === id);
      if (i >= 0) A[i] = d; else A.push(d);
    });
    liveRefresh();
  }
  function liveSettings(data) {
    if (!data) return;
    const next = { ...SETTINGS_DEFAULT(), ...clone(data) };
    if (JSON.stringify(next) === JSON.stringify(S)) return;
    S = next; liveRefresh();
  }
  // nie neu zeichnen, während jemand in ein Feld tippt (sonst springt der Cursor raus)
  const typing = () => !!document.activeElement?.closest?.("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  function liveRefresh() {
    if (typing()) return;
    if (view === "uebersicht") renderOverview();
    else if (view === "produktion") renderProduction();
    else if (view === "artikel" && !dirty) {
      const a = A.find(x => x.id === curId);
      if (a && JSON.stringify(a) !== JSON.stringify(draft)) { draft = clone(a); renderEditor(draft); }
    }
    else if (view === "einstellungen" && !dirty && JSON.stringify(S) !== JSON.stringify(draftS)) { draftS = clone(S); renderSettings(); }
  }

  // ---------- Start ----------
  async function boot() {
    store = Local; mode = "local";
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const db = await Promise.race([window.claude.use("db"), new Promise(r => setTimeout(() => r(null), 10000))]);
        if (db) { store = Cloud(db); mode = "cloud"; }
      } catch (e) {}
    }
    let data;
    try { data = await store.load(); }
    catch (e) { store = Local; mode = "local"; data = await Local.load(); toast("Online-Speicher nicht erreichbar, arbeite lokal."); }
    if (!data.settings && !data.articles.length) {
      // Erster Start: lokale Daten (gleicher Browser) oder Vorversion übernehmen
      let seed = mode === "cloud" ? await Local.load() : null;
      if (!seed || (!seed.settings && !seed.articles.length)) seed = migrateV2();
      if (seed && (seed.settings || seed.articles.length)) {
        S = { ...SETTINGS_DEFAULT(), ...(seed.settings || {}) }; A = seed.articles || [];
        saveSettings(); A.forEach(saveArticle);
        if (A.length) toast(`${A.length} Artikel aus der Vorversion übernommen`);
      }
    } else {
      S = { ...SETTINGS_DEFAULT(), ...(data.settings || {}) }; A = data.articles || [];
    }
    try { SUP = await store.loadSupport(); } catch (e) { SUP = []; }
    try { ORD = await store.loadOrders(); } catch (e) { ORD = []; }
    ordBadge();
    setSync("ok");
    route();
    if (store.subscribe) store.subscribe(liveArticles, liveSettings);
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !(window.claude)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  boot();
})();
</script>
</body>
