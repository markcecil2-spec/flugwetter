<style>
/* Layout: Werkbank-App – Kopfleiste mit Reitern; Übersicht = Artikeltabelle mit Monatsergebnis; Artikel = Eingaben links, Ergebnis-Zettel rechts (sticky) */
:root {
  --bg: #f3f1ec;          /* Birkensperrholz */
  --panel: #fbfaf7;
  --line: #ddd8cd;
  --fg: #23201b;
  --muted: #6c665b;
  --accent: #2f5a46;      /* Werkstattgrün */
  --accent-soft: #dfe9e2;
  --on-accent: #fbfaf7;
  --walnut: #7a4b2a;
  --good: #2e7d4f; --warn: #b7791f; --bad: #b3412f;
  --seg-vat: #a8a195; --seg-fee: #c9813f; --seg-make: #7a4b2a; --seg-ship: #4f7896; --seg-pack: #9c8a6b; --seg-time: #8a6fa3; --seg-other: #7d7d7d; --seg-profit: #2e7d4f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1916; --panel: #23221e; --line: #3a372f; --fg: #ece8df; --muted: #a39d90;
  --accent: #7fb89a; --accent-soft: #24342b; --on-accent: #1a1916; --walnut: #c99467;
  --good: #5cbf85; --warn: #e0a84a; --bad: #e07a66;
  --seg-vat: #6f6a60; --seg-fee: #d89452; --seg-make: #b07a4f; --seg-ship: #6d9cc0; --seg-pack: #b3a17f; --seg-time: #a68cc0; --seg-other: #8f8f8f; --seg-profit: #5cbf85;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a1916; --panel: #23221e; --line: #3a372f; --fg: #ece8df; --muted: #a39d90;
  --accent: #7fb89a; --accent-soft: #24342b; --on-accent: #1a1916; --walnut: #c99467;
  --good: #5cbf85; --warn: #e0a84a; --bad: #e07a66;
  --seg-vat: #6f6a60; --seg-fee: #d89452; --seg-make: #b07a4f; --seg-ship: #6d9cc0; --seg-pack: #b3a17f; --seg-time: #a68cc0; --seg-other: #8f8f8f; --seg-profit: #5cbf85;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1800px; margin: 0 auto; display: grid; gap: 20px }
@media (min-width: 1200px) { .gutter { padding-left: 32px; padding-right: 32px } }
main p { max-width: 130ch }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0 }
h1 { font-size: 1.6rem; letter-spacing: -0.01em }
h2 { font-size: 1.15rem }
h3 { font-size: 1rem }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.note { font-size: .8rem; color: var(--muted); margin: 0 }
.ph { color: var(--warn); font-size: .8rem; margin: 0 }
.reco { font-size: .78rem; color: var(--muted); margin-top: 4px; white-space: nowrap }
.reco-big { margin: 4px 0 0; font-size: .95rem } .reco-big strong { color: var(--accent); font-size: 1.1rem }
.inp.est, .inp.need, .inp.changed { box-shadow: 0 0 0 2px var(--warn) }
table.ov td.name, table.ov th.selcol + th { text-align: left }
.selcol { width: 34px; padding-right: 0 }
.selstack { display: flex; flex-direction: column; align-items: center; gap: 4px }
.selstack .star { padding: 0; font-size: 1.05rem } .selcol input { width: 18px; height: 18px; accent-color: var(--accent) }
tr.selected td { background: var(--accent-soft) }
.cmp { margin: 10px 0; gap: 10px }
.cmp .row { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.cmp h3 { margin: 0 }
.cmptable { min-width: 0 }
.cmptable th, .cmptable td { padding: 6px 10px; vertical-align: top }
.cmptable th { text-transform: none; letter-spacing: 0; font-size: .9rem }
.cmptable tbody th { text-align: left; font-weight: 500; color: var(--muted); white-space: nowrap }
.cmptable .cmp-art { text-align: left; min-width: 150px; max-width: 220px; white-space: normal; font-weight: 600 }
.cmptable .cmp-art .thumb { float: none; display: block; margin: 0 0 6px; width: 56px; height: 56px }
.cmptable .cmp-sec th { padding-top: 14px; color: var(--fg); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em }
.cmptable tr.total th, .cmptable tr.total td { font-weight: 700; color: var(--fg) }
.cmptable tr.total td.best { color: var(--good) }
.cmptable td.best { color: var(--good); font-weight: 700 }
.linkbtn { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
.linkbtn:hover { text-decoration-color: currentColor }
.suptable th, .suptable td { text-align: left; vertical-align: top }
.colpick { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; display: grid; gap: 10px; background: var(--bg) }
.colpick-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.colpick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem }
.switch input { position: absolute; opacity: 0; pointer-events: none }
.switch .track { width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; flex: none; transition: background .15s }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s }
.switch input:checked + .track { background: var(--accent) }
.switch input:checked + .track::after { transform: translateX(16px) }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px }
table.ov td, table.ov th { white-space: nowrap }
table.ov td.name { white-space: normal; min-width: 260px }
.abc { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700; border: 1.5px solid currentColor; font-size: .85rem }
.abccell { display: grid; justify-items: center; gap: 2px; white-space: nowrap }
.abc.sm { width: 20px; height: 20px; font-size: .72rem }
.abc-A { color: var(--good) } .abc-B { color: var(--warn) } .abc-C { color: var(--muted) }
.rmbtn { font: 500 .78rem var(--font-body); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap }
.rmbtn:hover { border-color: var(--bad); color: var(--bad) }
.fortbtn { all: unset; cursor: pointer; display: grid; gap: 3px; justify-items: center; padding: 4px 6px; border-radius: 8px } .fortbtn:hover { background: var(--accent-soft) } .fortbtn:focus-visible { outline: 2px solid var(--accent) }
.fortbar { display: inline-flex; gap: 3px } .fortbar i { display: block; width: 14px; height: 8px; border-radius: 2px; background: var(--line) }
.progbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line) } .progbar div { height: 100% }
.chkitem { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; font-size: .92rem } .chkitem:hover { border-color: var(--accent) } .chkitem input { width: 18px; height: 18px; accent-color: var(--accent) } .chkitem.done span { color: var(--muted); text-decoration: line-through }
.rmbtn.bearb { border-color: var(--seg-ship); color: var(--seg-ship); background: color-mix(in srgb, var(--seg-ship) 12%, transparent) }
.rmbtn.okon { border-color: var(--good); color: var(--good) } .rmbtn.okon:hover { border-color: var(--good) }
.rmbtn.warnon { border-color: var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent) } .rmbtn.warnon:hover { border-color: var(--warn); color: var(--warn) }
.rmbtn.on { border-color: var(--bad); background: var(--bad); color: #fff }
tr.rmrow td:not(:first-child) { opacity: .6 }
.chip.rm { color: var(--bad); font-weight: 600 }
.anatable th, .anatable td { text-align: left; vertical-align: top; padding: 6px 10px; white-space: normal }
.anatable td.num, .anatable th.r { white-space: nowrap }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
@media (max-width: 760px) { .tiles.t3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.anatable th.r, .anatable td.r { text-align: right }
.anabar { display: block; height: 8px; min-width: 90px; border-radius: 4px; background: var(--line); overflow: hidden }
.anabar i { display: block; height: 100%; border-radius: 4px }
.mtab td { padding: 3px 3px }
.mtab .inp { min-width: 0 }
.mtab .inp input { width: 96px; min-width: 0; text-align: right; padding: 6px 6px; font-size: .82rem }
.mtab .inp select { width: 124px; padding: 6px 6px; font-size: .82rem }
.mtab td:first-child .inp input { width: 230px; text-align: left; font-size: .85rem }
.mtab tr.off td { opacity: .5 }
.mtab tr.tot td { border-top: 2px solid var(--line) }
.mtab .btn { padding: 4px 8px; font-size: .78rem }
.finmini { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 4px; color: var(--muted); font-size: .9rem } .finmini strong { color: var(--fg) }
.fintips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.finbrief { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px }
.finpair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.finrow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; align-items: start }
@media (max-width: 1100px) { .finrow { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) } }
.finsub { display: grid; gap: 8px; margin-top: 10px; padding-left: 10px; border-left: 3px solid var(--line) }
.finsub label { font-size: 12.5px }
.anagrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.tipbtn { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 4px; padding: 0; border-radius: 50%; border: 1.5px solid currentColor; background: transparent; font: 700 11px/1 var(--font-body); cursor: help; vertical-align: 1px }
.tipbtn.good { color: var(--good) } .tipbtn.warn { color: var(--warn) } .tipbtn.bad { color: var(--bad) }
#tipPop { position: fixed; z-index: 50; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(1160px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 12px 14px; border-radius: 10px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 10px 30px rgb(0 0 0 / .22); font-size: .85rem; line-height: 1.45 }
.tipgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start }
@media (min-width: 900px) { .tipgrid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr) } }
#tipPop { font-size: .92rem }
#tipPop textarea { min-height: 220px }
#tipPop ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px }
#tipPop li { padding-left: 10px; border-left: 3px solid var(--line) } #tipPop li.t-good { border-color: var(--good) } #tipPop li.t-warn { border-color: var(--warn) } #tipPop li.t-bad { border-color: var(--bad) }
.navbadge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--warn); color: #fff; font-size: .72rem; font-weight: 700; line-height: 18px; text-align: center }
.ordtable th, .ordtable td { text-align: left; vertical-align: top; padding-left: 8px; padding-right: 8px }
.ordtable tr.orddone td { opacity: .55 }
.ordline { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-width: 240px; max-width: 460px }
.ordline > div { flex: 1; min-width: 0 }
.ordline .thumb { float: none; width: 36px; height: 36px; margin: 0; flex: none }
.ordline select { width: 100%; max-width: 100%; font: inherit; font-size: .85rem; padding: 4px 6px; border: 1px solid var(--warn); border-radius: 6px; background: var(--bg); color: inherit }
.ordqty { font-weight: 700; white-space: nowrap }
.ordtable input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent) }
.prodtable th, .prodtable td { text-align: left; vertical-align: middle; white-space: nowrap }
.prodtable td.name { white-space: normal; min-width: 190px }
.prodtable .thumb { float: none; display: block; width: 52px; height: 52px; margin: 0; border-radius: 8px }
.prodtable .inp { max-width: 190px }
.prodtable .inp.qprice { width: 112px }
.prodtable .inp.qprice input { font-size: 1.05rem }
.prodtable .inp.qprice input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0 }
.prodtable .inp.qprice input[type=number] { -moz-appearance: textfield; appearance: textfield; text-align: center }
.stepper { display: inline-flex; align-items: center; gap: 6px }
.stbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 1.6rem/1 var(--font-body); cursor: pointer; display: grid; place-items: center; padding: 0; user-select: none; touch-action: manipulation }
.stbtn:hover { border-color: var(--accent) } .stbtn:active { background: var(--accent-soft); border-color: var(--accent) }
.prodtable .stepper .inp.qprice { width: 84px }
.prodtable .stepper .inp.qprice input { width: 100%; font-size: 1.15rem; font-weight: 600 }
tr.prodon td { background: var(--accent-soft) }
tr.prodon [data-q="prod"] { font-weight: 700 }
.ppneed strong { font-size: 1.6em; color: var(--accent) }
.pptable td { vertical-align: middle }
.shopfix { margin: 4px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.fixhtml { font-size: .86rem; max-height: 140px; overflow: auto; border-left: 3px solid var(--line); padding-left: 8px }
.debttable td:nth-child(2) .inp { min-width: 110px } .debttable td:nth-child(4) .inp { width: 100px } .debttable td:nth-child(3) .inp { min-width: 140px } .debttable td:nth-child(1) .inp { min-width: 150px }
.dcbtn { padding: 2px 8px; min-height: 26px; font-size: .78rem }
.chkcol { display: grid; gap: 4px; white-space: nowrap }
.mvbtns { display: inline-flex; flex-direction: column; gap: 2px; vertical-align: middle; margin-right: 4px }
.mvbtns .btn { padding: 0 8px; min-height: 20px; line-height: 1; font-size: .7rem }
.shoptasks { margin: 0; padding-left: 22px; display: grid; gap: 10px }
.shopman { display: grid; gap: 8px; margin-top: 8px }
#printArea { display: none }
@media print {
  body > *:not(#printArea) { display: none !important }
  #printArea { display: block !important; padding: 8px; color: #000; background: #fff }
  #printArea h1 { font: 700 20px sans-serif; margin: 0 0 12px }
  #printArea h2 { font: 700 16px sans-serif; margin: 16px 0 6px }
  #printArea table { border-collapse: collapse; width: 100% }
  #printArea th, #printArea td { border: 1px solid #888; padding: 6px 8px; font: 14px sans-serif; text-align: left; vertical-align: middle }
  #printArea img { width: 56px; height: 56px; object-fit: cover; float: none; display: block }
  #printArea .chk { font-size: 22px; text-align: center } #printArea .qty { font: 700 20px sans-serif; text-align: center }
  #printArea tr { break-inside: avoid }
}
.supbars { display: grid; gap: 12px }
.supbar { display: grid; gap: 4px }
.supbar-head { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem }
.supbar-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.supbar-track div { height: 100%; background: var(--accent); border-radius: 4px }
.selbar { position: sticky; top: calc(var(--toph, 60px) + 8px); z-index: 5; background: var(--panel); box-shadow: 0 4px 14px rgb(0 0 0 / .08); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; margin: 10px 0; border: 1px solid var(--accent); border-radius: 10px }
.selbar.danger { border-color: var(--bad) }
.selbar.danger .note { flex: 1 }
.bulkbox { margin: 10px 0; border-color: var(--accent) }
.inp textarea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 9px 10px; font: .95rem var(--font-body); outline: none; resize: vertical }
.todo-box { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line) }
.todo-note { margin-top: 4px; font-size: .82rem; color: var(--warn); white-space: normal }
.stabs { margin: 4px 0 14px } .stackset { max-width: 760px }
.chmini { font: inherit; font-size: .8rem; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit }
.inp.chsel { display: inline-flex; width: auto; max-width: 100%; margin-bottom: 10px }
label.check { margin-top: 10px; font-weight: 600 }
label.check small { font-weight: 400; color: var(--muted) }

/* Kopfleiste */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
.top .wrap { grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0 }
.logo { width: 34px; height: 34px; border-radius: 8px; flex: none; display: block }
.brand strong { font-family: var(--font-display); font-size: 1.05rem; white-space: nowrap }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .9rem; padding: 6px 12px; border-radius: 999px }
nav.tabs a.navpriv { color: var(--walnut) }
.todorow { display: grid; grid-template-columns: 28px minmax(160px, 1fr) 150px 130px 40px 40px; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line) }
.todorow.done .inp input[type=text] { text-decoration: line-through; color: var(--muted) }
.dayrow { display: grid; grid-template-columns: 26px 128px 128px 84px minmax(150px, 1fr) 132px 100px 40px; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); border-radius: 4px }
.dayhead { display: grid; grid-template-columns: 26px 128px 128px 84px minmax(150px, 1fr) 132px 100px 40px; gap: 8px; padding: 0 8px 4px 12px; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.dayrow.now { background: var(--accent-soft) }
.dayrow.done .inp input[type=text] { text-decoration: line-through; color: var(--muted) }
.dayrow .daynote { grid-column: 5 / -1; margin-top: -4px }
.dayrow .inp input[type=time] { width: 100% }
@media (max-width: 860px) { .dayhead { display: none } .dayrow { grid-template-columns: 26px 1fr 1fr 40px } .dayrow .daydur { display: none } .dayrow .inp:nth-of-type(3), .dayrow .inp:nth-of-type(4), .dayrow .inp:nth-of-type(5) { grid-column: 2 / -1 } }
.todoadd { display: grid; grid-template-columns: minmax(180px, 1fr) 170px auto; gap: 8px; align-items: center }
@media (max-width: 720px) { .todorow { grid-template-columns: 28px 1fr 40px 40px } .todorow .inp:nth-of-type(2), .todorow .inp:nth-of-type(3) { grid-column: 2 / -1 } .todoadd { grid-template-columns: 1fr } }
nav.tabs a[aria-current=page] { background: var(--accent-soft); color: var(--accent) }
/* Kalkulator links, Betrieb (Bestellungen, Produktion, Support) rechts davon, durch einen Strich getrennt */
.navsep { align-self: center; width: 1px; height: 20px; background: var(--line); margin: 0 14px }
.sync { font-size: .75rem; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good) }
.sync.saving .dot { background: var(--warn) } .sync.err .dot { background: var(--bad) }
@media (max-width: 720px) {
  .top .wrap { grid-template-columns: 1fr auto; row-gap: 6px }
  nav.tabs { grid-column: 1 / -1; justify-content: flex-start; order: 3 }
  .navsep { display: none }
}
main.wrap { padding-block: 20px 48px }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start }

  }

  // ---------- Bestellungen: Shopify (direkt) und Etsy (aus den Bestätigungsmails in Gmail) ----------
  let ORD = [];
  let ord = { f: "open", busy: false, msg: "", err: "", ask: "" };
  const MONTHS = { jan: 0, feb: 1, mär: 2, mar: 2, apr: 3, mai: 4, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, okt: 9, oct: 9, nov: 10, dez: 11, dec: 11 };
  const deNum = x => { const f = parseFloat(String(x || "").replace(/\./g, "").replace(",", ".")); return isFinite(f) ? f : 0; };
  const decEnt = x => { const t = document.createElement("textarea"); t.innerHTML = x; return t.value; };
  const ordArt = id => A.find(a => a.id === id);
  const lineLabel = a => a.name.split(" · ").slice(1).join(" ");
  const ordKey = (title, variant) => normTitle(title) + "|" + normTitle(variant);
  const ordOpen = o => o.status === "offen";
  const ordPcs = o => (o.lines || []).reduce((n, l) => n + v(l.qty), 0);
  function ordBadge() {
    const el = $("ordBadge"); if (!el) return; const n = ORD.filter(ordOpen).length;
    el.textContent = n || ""; el.hidden = !n;
  }
  // Artikel zu einer SKU; bei mehreren Varianten mit gleicher SKU entscheidet der Variantentext
  function ordResolve(sku, variant) {
    const c = sku ? A.filter(a => a.sku && norm(a.sku) === norm(sku)) : []; if (!c.length) return null;
    if (c.length === 1) return c[0];
    const vt = normTitle(variant), hit = c.filter(a => { const l = normTitle(lineLabel(a)); return l && vt && (vt.includes(l) || l.includes(vt)); });
    return (hit.length ? hit : c)[0];
  }
  // offen bestellte Stückzahl je Artikel
  function ordDemand() {
    const d = {}; ORD.filter(ordOpen).forEach(o => (o.lines || []).forEach(l => { if (l.aid) d[l.aid] = (d[l.aid] || 0) + v(l.qty); }));
    return d;
  }
  const mcpErr = (server, e) => ({
    no_mcp: "Die Verbindung geht nur in der App auf claude.ai.",
    server_not_connected: server + " ist nicht verbunden: claude.ai → Einstellungen → Connectors hinzufügen.",
    needs_reauth: server + " neu verbinden: claude.ai → Einstellungen → Connectors.",
    not_in_manifest: "Du hast den Zugriff auf " + server + " für diese App abgelehnt.",
    approval_required: "Der Zugriff auf " + server + " braucht deine Freigabe. Nochmal klicken und erlauben.",
    tool_error: server + " meldet einen Fehler: " + (e && e.message || ""),
    server_unavailable: server + " ist gerade nicht erreichbar, bitte gleich nochmal versuchen."
  }[e && e.code] || "Fehler bei " + server + ": " + (e && (e.message || e.code) || "unbekannt"));
  async function gmail(tool, input) {
    const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
    if (!mcp) throw { code: "no_mcp" };
    const res = await mcp.callTool("Gmail", tool, input, { cache: false });
    return res.payload && typeof res.payload === "object" ? res.payload : {};
  }

  // Etsy-Bestätigungsmail → Bestellung (ohne Namen und Adresse; nur Land)
  function ordParseEtsy(th) {
    const m = (th.messages || [])[0] || {}, body = m.plaintextBody || m.plaintext_body || "", subj = m.subject || "";
    const no = (subj.match(/Bestellung Nr\.\s*(\d+)/) || body.match(/Bestellnummer:\s*(\d+)/) || [])[1]; if (!no) return null;
    const at = String(m.date || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    let shipBy = "";
    const sb = subj.match(/Versand bis\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{1,2})/);
    if (sb && MONTHS[sb[1].slice(0, 3).toLowerCase()] !== undefined) {
      const mon = MONTHS[sb[1].slice(0, 3).toLowerCase()], day = +sb[2], base = new Date(at + "T00:00:00");
      let y = base.getFullYear(); if (new Date(y, mon, day) < new Date(base.getTime() - 30 * 864e5)) y++;
      shipBy = `${y}-${String(mon + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    const lines = [], re = /Transaktions-Nr\.:\s*\d+\s*\n\s*Artikel:[ \t]*([^\n]*)\n([\s\S]*?)St(?:ü|&uuml;)ckzahl:\s*(\d+)\s*\n\s*Artikelpreis:\s*([\d.,]+)/g;
    let x; while ((x = re.exec(body))) {
      const variant = x[2].split("\n").map(t => decEnt(t).trim()).filter(Boolean).join(" · ");
      lines.push({ sku: "", title: decEnt(x[1]).trim(), variant, qty: +x[3], price: deNum(x[4]), aid: "" });
    }
    if (!lines.length) return null;
    const tot = body.match(/Gesamtsumme[^:\n]*:\s*([\d.,]+)/) || subj.match(/\[([\d.,]+)\s*€/);
    return { id: "etsy-" + no, src: "etsy", no, at, shipBy, total: tot ? deNum(tot[1]) : 0, country: decEnt((body.match(/country-name'>([^<]+)</) || [])[1] || "").trim(), status: "offen", lines, thread: m.threadId || th.id || "" };
  }

  function ordUpsertShopify(n) {
    const no = String(n.name || "").replace(/\D/g, ""); if (!no) return 0;
    const id = "shop-" + no, old = ORD.find(o => o.id === id);
    const done = n.displayFulfillmentStatus === "FULFILLED";
    const o = { id, src: "shopify", no: "#" + no, at: String(n.createdAt || "").slice(0, 10), shipBy: "", total: v(((n.totalPriceSet || {}).shopMoney || {}).amount),
      country: (n.shippingAddress || {}).countryCodeV2 || "", manual: old ? !!old.manual : false,
      status: n.cancelledAt ? "storniert" : done ? "erledigt" : (old && old.manual ? old.status : "offen"),
      lines: ((n.lineItems || {}).nodes || []).map(l => { const a = ordResolve(l.sku, l.variantTitle); return { sku: l.sku || "", title: l.title || "", variant: l.variantTitle || "", qty: l.quantity || 0, price: v(((l.originalUnitPriceSet || {}).shopMoney || {}).amount), aid: a ? a.id : "" }; }) };
    if (old && JSON.stringify(old) === JSON.stringify(o)) return 0;
    const i = ORD.findIndex(x => x.id === id); if (i >= 0) ORD[i] = o; else ORD.push(o);
    saveOrder(o); return old ? 0 : 1;
  }

  // Etsy-Positionen den Artikeln zuordnen: gemerkte Zuordnung, sonst Claude (Vorschlag, in der Liste korrigierbar)
  async function ordMapEtsy() {
    S.ordMap = S.ordMap || {};
    const info = { err: "", unmapped: 0 };
    // früher falsch gelesen: leerer Titel, dann stand die Variante im Titel
    ORD.forEach(o => { if (o.src === "etsy") o.lines.forEach(l => { if (!l.aid && l.title && !/\|/.test(l.title) && /^[^:]{1,40}:\s/.test(l.title) && l.title.length < 70) { l.variant = l.title + (l.variant ? " · " + l.variant : ""); l.title = ""; saveOrder(o); } }); });
    const open = []; ORD.forEach(o => o.lines.forEach((l, i) => { if (!l.aid && o.src === "etsy") open.push([o, i, l]); }));
    const changed = new Set();
    open.forEach(([o, i, l]) => { const id = S.ordMap[ordKey(l.title, l.variant)]; if (id && ordArt(id)) { l.aid = id; l.sku = ordArt(id).sku || ""; changed.add(o); } });
    const rest = open.filter(([o, i, l]) => !l.aid), keys = [...new Set(rest.map(([o, i, l]) => ordKey(l.title, l.variant)))];
    if (keys.length) {
      const sample = await getSample();
      if (sample) {
        const first = {}; rest.forEach(([o, i, l]) => { first[ordKey(l.title, l.variant)] = l; });
        const arts = A.map((a, i) => `${i}|${a.sku || "-"}|${a.name}|${v(a.price) ? dec(v(a.price), 0) + " €" : "?"}`).join("\n");
        const pos = keys.map((k, i) => `${i}|${first[k].title || "(ohne Titel)"} | ${first[k].variant} | ${dec(v(first[k].price), 0)} €`).join("\n");
        try {
          const r = await sample.json(`Ordne jede Etsy-Bestellposition dem passenden Artikel aus der Liste zu. Die Position besteht aus dem Etsy-Angebotstitel (oft englisch) und der gewählten Variante (Größe, Hakenzahl, Farbe, Gravur). Der Titel steht in der Sprache des Käufers (englisch, französisch …), die Artikelnamen sind deutsch. Die Variante nennt Breite/Länge in cm (z. B. „Width: 70 Centimeters“, „Breite/Gravur: 40 cm - 7 Haken“), Hakenzahl und Gravur. Die Hakenfarbe (Schwarz, Silber, Gold) ignorierst du. Fehlt der Titel, entscheiden Größe, Hakenzahl und Preis. Der Preis ist der Etsy-Preis pro Stück und passt meist zum Artikelpreis. Gib nur dann einen Artikel an, wenn Produkt UND Größe passen. Sonst null.

ARTIKEL (Nr|SKU|Name|Preis):
${arts}

POSITIONEN (Nr|Angebotstitel | Variante | Preis pro Stück):
${pos}

Antworte NUR mit JSON: {"0": <Artikelnummer oder null>, "1": ...}. Schlüssel = Nummer der Position.`, { modelTier: "default", cache: { gcTime: 600000 } });
          keys.forEach((k, i) => { const idx = r && r[String(i)]; const a = Number.isInteger(idx) ? A[idx] : null; if (a) S.ordMap[k] = a.id; });
          saveSettings();
          rest.forEach(([o, i, l]) => { const id = S.ordMap[ordKey(l.title, l.variant)]; if (id && ordArt(id)) { l.aid = id; l.sku = ordArt(id).sku || ""; changed.add(o); } });
        } catch (e) { info.err = supErr(e).replace(/\.$/, ""); }
      } else info.err = "Claude ist hier nicht verfügbar";
    }
    changed.forEach(saveOrder);
    info.unmapped = ORD.reduce((n, o) => n + (o.src === "etsy" && ordOpen(o) ? o.lines.filter(l => !l.aid).length : 0), 0);

  }

  // Ab wann gesucht wird: erster Lauf nach Wahl (heute oder x Tage zurück), danach ab dem letzten Lauf (2 Tage Überlappung, bekannte Bestellungen werden eh übersprungen)
  const isoDay = t => new Date(t).toISOString().slice(0, 10);
  function ordSince(daysBack) {
    if (daysBack !== undefined) return isoDay(Date.now() - daysBack * 864e5);
    const last = S.ordLast || ORD.filter(o => o.src === "etsy").map(o => o.at).sort().pop() || "";
    return isoDay(last ? new Date(last + "T00:00:00").getTime() - 2 * 864e5 : Date.now() - 30 * 864e5);
  }
  // Billbee-Abgleich (läuft außerhalb der App): neue Felder aus der Datenbank übernehmen und Artikel über die SKU zuordnen
  async function ordBbMerge() {
    try {
      const fresh = await store.loadOrders();
      fresh.forEach(f => { const i = ORD.findIndex(x => x.id === f.id);
        if (i < 0) ORD.push(f);
        else { const o = ORD[i]; ["bb", "bbState", "bbShipped", "bbShip"].forEach(k => { if (f[k] !== undefined && o[k] !== f[k]) o[k] = f[k]; }); if (f.bb && f.status === "erledigt" && o.status === "offen" && !o.manual) o.status = "erledigt"; } });
    } catch (e) { /* offline: lokale Liste bleibt */ }

  }
  async function ordSync(daysBack) {
    if (ord.busy) return;
    ord.busy = true; ord.err = ""; ord.msg = "Billbee-Stand wird geladen …"; renderOrders();

    const errs = []; let nNew = 0;
    try {
      // Shopify: neue Bestellungen plus alle noch offenen (damit „versendet“ ankommt)
      const oldestOpen = ORD.filter(o => o.src === "shopify" && o.status === "offen").map(o => o.at).sort()[0] || "9999";
      const sinceE = ordSince(daysBack), since = oldestOpen < sinceE ? oldestOpen : sinceE; let after = null;
      for (let page = 0; page < 8; page++) {
        const d = await shopify("graphql_query", { query: "query($first:Int!,$after:String,$q:String){ orders(first:$first, after:$after, query:$q, sortKey:CREATED_AT, reverse:true){ pageInfo{ hasNextPage endCursor } nodes{ name createdAt displayFulfillmentStatus cancelledAt totalPriceSet{ shopMoney{ amount } } shippingAddress{ countryCodeV2 } lineItems(first:50){ nodes{ sku title variantTitle quantity originalUnitPriceSet{ shopMoney{ amount } } } } } } }", first: 50, variables: { first: 50, after, q: "created_at:>=" + since } });

        if (!os.pageInfo.hasNextPage) break; after = os.pageInfo.endCursor;
      }
    } catch (e) { errs.push("Shopify: " + mcpErr("Shopify", e)); }
    try {
      ord.msg = "Etsy-Mails werden gesucht …"; renderOrders();
      const threads = []; let tok = "";
      for (let page = 0; page < 4; page++) {
        const r = await gmail("search_threads", { query: `from:transaction@etsy.com subject:"Bestellung Nr." after:${ordSince(daysBack).replace(/-/g, "/")}`, pageSize: 50, ...(tok ? { pageToken: tok } : {}), view: "THREAD_VIEW_MINIMAL" });
        (r.threads || []).forEach(t => threads.push(t)); tok = r.nextPageToken || ""; if (!tok) break;
      }
      const fresh = threads.filter(t => { const sj = ((t.messages || [])[0] || {}).subject || ""; const no = (sj.match(/Bestellung Nr\.\s*(\d+)/) || [])[1]; return no && !ORD.some(o => o.id === "etsy-" + no); });
      for (let i = 0; i < fresh.length; i++) {

        const th = await gmail("get_thread", { threadId: fresh[i].id, messageFormat: "PLAIN_TEXT" });

    if (mapInfo.err) errs.push("Automatische Zuordnung: " + mapInfo.err + ". Bitte unten per Auswahl zuordnen.");
    else if (mapInfo.unmapped) errs.push(mapInfo.unmapped + " Position" + (mapInfo.unmapped > 1 ? "en" : "") + " nicht sicher zuzuordnen (z. B. Titel fehlt oder Variante mehrdeutig). Bitte unten per Auswahl zuordnen, die App merkt es sich.");
    ord.busy = false; ord.err = errs.join(" · ");

    ord.msg = errs.length && !nNew ? "" : (nNew ? nNew + " neue Bestellung" + (nNew > 1 ? "en" : "") + " geholt." : "Keine neuen Bestellungen.");

  }

  // Versandprofil je Bestellung: automatisch aus Gewicht und Karton der Artikel (mehrere Teile: Gewichte addiert, Höhen gestapelt), von Hand änderbar
  function ordShipAuto(o) {
    const L = (o.lines || []).map(l => ({ a: ordArt(l.aid), q: v(l.qty) || 1 })); if (!L.length || L.some(x => !x.a)) return null;
    const W = L.reduce((n, x) => n + shipWeight(x.a) * x.q, 0), big = L.reduce((m, x) => { const d = [v(x.a.pkL), v(x.a.pkB), v(x.a.pkH)].sort((p, q) => q - p); return d[0] * d[1] > m.k ? { k: d[0] * d[1], d } : m; }, { k: -1, d: [0, 0, 0] }).d;
    const n = L.reduce((c, x) => c + x.q, 0), dim = [big[0], big[1], big[2] * Math.max(1, n)].sort((p, q) => q - p);
    const fit = (S.ship || []).filter(x => W <= v(x.g) && dim.every((d, k) => d <= [v(x.l), v(x.b), v(x.h)].sort((p, q) => q - p)[k])).sort((x, y) => shipP(x) - shipP(y))[0];
    return fit ? { o: fit, w: W, multi: n > 1 } : { o: null, w: W, multi: n > 1 };
  }

    const opts = [`<option value="">Automatisch${au && au.o ? ": " + esc(au.o.n) : ""}</option>`].concat((S.ship || []).map(x => `<option value="${esc(x.n)}" ${sel === x.n ? "selected" : ""}>${esc(x.n)}</option>`)).join("");
    return `<select data-ordship="${o.id}" aria-label="Versandart ${esc(o.no)}">${opts}</select>${cur ? `<div class="note">${eur(shipP(cur))} Porto${au && au.w ? " · " + kg(au.w) : ""}${!sel && au && au.multi ? " · mehrere Teile, bitte prüfen" : ""}</div>` : `<div class="note">${au ? "passt in keine Versandart, bitte wählen" : "Artikel zuordnen"}</div>`}${o.bbShip ? `<div class="note">Billbee: ${esc(o.bbShip)}</div>` : ""}`;
  }
  function renderOrders() {
    const all = ORD.slice().sort((a, b) => (b.at || "").localeCompare(a.at || "") || String(b.no).localeCompare(String(a.no), "de", { numeric: true }));

    const lineHTML = (o, l, i) => { const a = ordArt(l.aid);

    $("view").innerHTML = `
      <div class="row"><h1>Bestellungen</h1>${ORD.length || S.ordLast ? `<button type="button" class="btn primary" data-act="ordSync" ${ord.busy ? "disabled" : ""}>${ord.busy ? "Lade …" : "↻ Neue Bestellungen holen"}</button>`

      ${ord.msg ? `<p class="note" style="color:var(--fg)"><strong>${esc(ord.msg)}</strong></p>` : ""}${ord.err ? `<p class="note" style="color:var(--bad)">${esc(ord.err)}</p>` : ""}

  // ---------- Produktion: Pickingliste (was soll gebaut werden) ----------

  };
  let prod = { q: "", only: false, cat: "", ask: "", copy: "", tab: "liste", mon: 1, base: 3, ppAll: false, ppRoh: false };
  const prodRows = () => A.map(a => ({ a, cat: prodCat(a) })).sort((x, y) => (norm(x.a.sku) || "~").localeCompare(norm(y.a.sku) || "~", "de", { numeric: true }));
  const prodTodo = () => A.filter(a => v(a.prod) > 0);
  // Sortierung der Produktionsliste: Klick auf die Spaltenüberschrift, nochmal Klick dreht um (wird pro Gerät gemerkt)
  let psort = LS.get("hlz-app-psort") || { k: "sku", d: 1 };
  const PSORT = {
    sku: { t: "text", f: x => norm(x.a.sku) },

    cat: { t: "text", f: x => norm(x.cat) },

    prod: { t: "num", f: x => v(x.a.prod) },
    stock: { t: "num", f: x => v(x.a.stock) },

  };
  function prodSorted(list, dm) {
    const c = PSORT[psort.k] || PSORT.sku, key = x => c.f(x, dm), tie = (x, y) => (norm(x.a.sku) || "~").localeCompare(norm(y.a.sku) || "~", "de", { numeric: true });
    return list.slice().sort((x, y) => {
      const a = key(x), b = key(y);

      if (c.t === "text") { if (!a && b) return 1; if (a && !b) return -1; const r = String(a).localeCompare(String(b), "de", { numeric: true }); return (r * psort.d) || tie(x, y); }
      return ((a - b) * psort.d) || tie(x, y);

  }
  const pth = (k, l) => `<button type="button" data-psort="${k}" aria-pressed="${psort.k === k}" title="Klicken zum Sortieren, nochmal klicken dreht die Reihenfolge">${l}${psort.k === k ? (PSORT[k].t === "text" ? (psort.d > 0 ? " A→Z" : " Z→A") : (psort.d > 0 ? " ↑" : " ↓")) : " ⇅"}</button>`;

  let pcolsOpen = false;
  const pvis = () => { const on = LS.get("hlz-app-prodcols") || colDef("prod"); return PCOLS.filter(c => c.lock || (Array.isArray(on) ? on.includes(c.k) : c.def)); };

  const prodTabs = () => `<div class="seg" aria-label="Ansicht" style="margin:6px 0 10px"><button type="button" data-pp="tab:liste" aria-pressed="${prod.tab !== "vor"}">Produktionsliste</button><button type="button" data-pp="tab:vor" aria-pressed="${prod.tab === "vor"}">Vorproduktion</button></div>`;
  function renderProduction() {

    const all = prodRows(), cats = [...new Set(all.map(x => x.cat))].sort((a, b) => a.localeCompare(b, "de")), demand = ordDemand();

      && (!prod.q || norm(x.a.name).includes(norm(prod.q)) || norm(x.a.sku).includes(norm(prod.q))));

  // Günstigster Karton, in den der größte Rohling passt (1 cm Luft je Maß)

  function packOptions(a) {

    if (!parts.length) return [];

    const sort = d => d.sort((x, y) => y - x);

    const fits = (S.boxes || []).filter(b => b.n && (!priced || v(b.p) > 0)).filter(b => {
      const inner = [v(b.l), v(b.b), v(b.h)].sort((x, y) => y - x).map(x => x - 1);
      return opts.some(need => need.every((n, i) => n <= inner[i]));

    // Günstigster Karton; bei weniger als 10 Cent Unterschied lieber der kleinere
    const vol = b => v(b.l) * v(b.b) * v(b.h);

  // Umbenennen in Stammdaten: Verweise in allen Artikeln mitziehen
  function renameRef(kind, oldN, newN) {
    if (!oldN || oldN === newN) return;
    A.forEach(a => {
      let ch = false;
      if (kind === "plate") (a.parts || []).forEach(p => { if (p.plate === oldN) { p.plate = newN; ch = true; } });
      if ((kind === "small" || kind === "mach") && a[kind] && oldN in a[kind]) { a[kind][newN] = a[kind][oldN]; delete a[kind][oldN]; ch = true; }
      if (kind === "ship" && a.shipMode === oldN) { a.shipMode = newN; ch = true; }
      if (kind === "box" && a.box === oldN) { a.box = newN; ch = true; }
      if (kind === "blank") (a.parts || []).forEach(p => { if (p.blank === oldN) { p.blank = newN; p.n = newN; ch = true; } });
      if (ch) saveArticle(a);
    });
  }

  // Geschätzten Wert als geprüft markieren (Antippen oder Ändern)
  function confirmPh(k, i) {
    const row = draftS[k][i];

    document.querySelectorAll(`[data-sl="${k}"][data-i="${i}"]`).forEach(x => x.parentElement.classList.remove("est"));
    const ph = $("ph-" + k), phs = draftS[k].filter(x => x.ph).map(x => x.n);
    if (ph) ph.textContent = phs.length ? "Geschätzt, bitte prüfen: " + phs.join(", ") + " · Antippen bestätigt den Wert" : "";
  }
  document.addEventListener("focusin", e => {

  // ---------- Eingaben ----------
  document.addEventListener("input", e => {
    const t = e.target, d = t.dataset, val = t.type === "checkbox" ? t.checked : t.value;

    if (d.col) { const on = new Set(ovCols().map(c => c.k)); t.checked ? on.add(d.col) : on.delete(d.col); LS.set("hlz-app-cols", OV_COLS.filter(c => on.has(c.k)).map(c => c.k)); return renderOverview(); }

    else if (bulk && d.bulk !== undefined) { bulk[d.bulk] = val; t.closest(".inp")?.classList.add("changed"); }
    else if (draftS && d.s) {
      draftS[d.s] = val; setDirty(true);

  let qNext = null;
  // Preis und Gewicht direkt in der Artikelliste ändern (Enter, Tab oder Feld verlassen = speichern)
  const qFmt = { price: a => v(a.price) ? v(a.price).toFixed(2).replace(".", ",") : "", weight: a => v(a.weight) ? String(Math.round(v(a.weight))) : "", mins: a => v(a.mins) ? dec(v(a.mins)) : "" };
  document.addEventListener("change", e => {
    if (e.target.dataset && e.target.dataset.ana) { S[e.target.dataset.ana] = e.target.value; saveSettings(); return renderAnalysis(); }

    const f = e.target.dataset && e.target.dataset.q, id = f && e.target.dataset.qid; if (!id) return;

    if (next) { const el = document.querySelector(`[data-q="${next[0]}"][data-qid="${next[1]}"]`); if (el) { el.focus(); el.select(); } }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("donePop").hidden) $("donePop").hidden = true; });
  document.addEventListener("keydown", e => {

  document.addEventListener("keydown", e => {
    const f = e.target.dataset && e.target.dataset.q;
    if (!f || !(e.key === "Enter" || e.key === "Tab")) return;
    const all = [...document.querySelectorAll(`[data-q="${f}"]`)], i = all.indexOf(e.target), to = all[i + (e.shiftKey ? -1 : 1)];
    if (!to) { if (e.key === "Enter") e.target.blur(); return; }

    const el = document.querySelector(`[data-q="${qNext[0]}"][data-qid="${qNext[1]}"]`); qNext = null; if (el) { el.focus(); el.select(); }

  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((x, y) => y[1] - x[1])[0][0];
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim() !== ""));
  }

      <div class="inp"><input type="date" data-todo="due|${t.id}" value="${esc(t.due || "")}" aria-label="Termin" ${od ? 'style="color:var(--bad)"' : ""}></div>
      <div class="inp"><select data-todo="rep|${t.id}" aria-label="Wiederholen">${TODO_REP.map(([k, l]) => `<option value="${k}" ${(t.rep || "") === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <button type="button" class="btn" data-todo-star="${t.id}" aria-pressed="${!!t.p}" title="Wichtig" style="${t.p ? "color:var(--warn);border-color:var(--warn)" : ""}">★</button>
      <button type="button" class="btn" data-todo-del="${t.id}" aria-label="Löschen">×</button></div>`;
  }
  function renderTodo() {
    const td = todayISO(), wk = addDays(td, 7), list = TODOS(), open = list.filter(t => !t.done);
    const srt = a => a.slice().sort((x, y) => (y.p ? 1 : 0) - (x.p ? 1 : 0) || String(x.due || "9").localeCompare(String(y.due || "9")));
    const G = [["Überfällig", open.filter(t => t.due && t.due < td), "bad"], ["Heute", open.filter(t => t.due === td), "warn"], ["Diese Woche", open.filter(t => t.due > td && t.due <= wk), ""], ["Später", open.filter(t => t.due > wk), ""], ["Ohne Termin", open.filter(t => !t.due), ""]];
    const done = list.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 20);
    todoSug = todoSuggestions();
    $("view").innerHTML = `${privBar("todo")}<div class="row"><h1>To-do</h1></div>
      <section class="box"><h2>Neue Aufgabe</h2>
        <div class="todoadd"><div class="inp"><input type="text" id="todoNew" placeholder="Was ist zu tun?" aria-label="Neue Aufgabe" autocomplete="off"></div>
          <div class="inp"><select id="todoDue" aria-label="Termin"><option value="">ohne Termin</option><option value="0">heute</option><option value="1">morgen</option><option value="3">in 3 Tagen</option><option value="7">in einer Woche</option><option value="30">in einem Monat</option></select></div>
          <button type="button" class="btn primary" data-todo-add>+ Aufgabe</button></div></section>
      ${todoSug.length ? `<section class="box" style="margin-top:12px"><h2>Vorschläge aus deinen Finanzen</h2><p class="note">Das fällt gerade an. Mit „+“ übernimmst du es in deine Liste.</p>
        ${todoSug.map((s, i) => `<div class="row" style="justify-content:space-between;gap:8px"><span>${esc(s.t)}${s.due ? ` <span class="note">· ${dDE(s.due)}</span>` : ""}</span><button type="button" class="btn" data-todo-sug="${i}">+ übernehmen</button></div>`).join("")}</section>` : ""}
      ${G.map(([n, l, c]) => l.length ? `<section class="box" style="margin-top:12px"><h2${c ? ` style="color:var(--${c})"` : ""}>${n} <span class="note">${l.length}</span></h2>${srt(l).map(todoRow).join("")}</section>` : "").join("")}
      ${!open.length ? `<section class="box empty" style="margin-top:12px"><p>Nichts offen. Schreib oben deine erste Aufgabe auf.</p></section>` : ""}
      ${done.length ? `<section class="box" style="margin-top:12px"><div class="row"><h2>Erledigt <span class="note">${done.length}</span></h2><button type="button" class="btn" data-todo-donetoggle>${todoDoneOpen ? "ausblenden" : "anzeigen"}</button></div>${todoDoneOpen ? done.map(todoRow).join("") : ""}</section>` : ""}`;
    todoBadge();
  }
  let todoTimer = null;
  const todoSoon = () => { clearTimeout(todoTimer); todoTimer = setTimeout(() => { if (view !== "todo") return; if (typing()) return todoSoon(); const sy = window.scrollY; renderTodo(); window.scrollTo(0, sy); }, 700); };
  function todoAdd() {
    const inp = $("todoNew"); if (!inp) return; const t = inp.value.trim(); if (!t) { toast("Schreib erst die Aufgabe auf."); return; }
    const dv = $("todoDue").value; TODOS().push({ id: uid(), t, due: dv === "" ? "" : addDays(todayISO(), +dv), p: false, rep: "", done: false, made: Date.now() });
    saveSettings(); renderTodo(); const n = $("todoNew"); if (n) n.focus();
  }
  document.addEventListener("keydown", e => { if (view === "todo" && e.key === "Enter" && e.target.id === "todoNew") { e.preventDefault(); todoAdd(); } });
  document.addEventListener("change", e => {
    if (view !== "todo") return; const el = e.target, d = el.dataset.todo; if (!d) return;
    const [f, id] = d.split("|"), t = TODOS().find(x => x.id === id); if (!t) return;
    if (f === "done") {
      t.done = el.checked; t.doneAt = t.done ? Date.now() : 0;
      if (t.done && t.rep) TODOS().push({ id: uid(), t: t.t, due: todoNext(t), p: t.p, rep: t.rep, done: false, made: Date.now() });   // wiederkehrend: nächste Aufgabe anlegen
      saveSettings(); return renderTodo();
    }
    if (f === "due") { const y = +String(el.value).slice(0, 4); if (el.value && (y < 2000 || y > 2100)) return; t.due = el.value; saveSettings(); el.dataset.pending = "1"; return; }
    if (f === "rep") { t.rep = el.value; saveSettings(); return renderTodo(); }
    t[f] = el.value; saveSettings(); todoSoon();
  });
  document.addEventListener("focusout", e => { if (view === "todo" && e.target.dataset && e.target.dataset.pending) { delete e.target.dataset.pending; renderTodo(); } });
  document.addEventListener("click", e => {
    if (view !== "todo") return;
    const t = e.target.closest("[data-todo-add],[data-todo-star],[data-todo-del],[data-todo-sug],[data-todo-donetoggle]"); if (!t) return; const d = t.dataset;
    if (d.todoAdd !== undefined) return todoAdd();
    if (d.todoDonetoggle !== undefined) { todoDoneOpen = !todoDoneOpen; return renderTodo(); }
    if (d.todoSug !== undefined) { const s = todoSug[+d.todoSug]; if (s) { TODOS().push({ id: uid(), t: s.t, due: s.due, p: !!s.p, rep: "", done: false, made: Date.now() }); saveSettings(); toast("Aufgabe übernommen"); renderTodo(); } return; }
    const task = TODOS().find(x => x.id === (d.todoStar || d.todoDel)); if (!task) return;
    if (d.todoStar) { task.p = !task.p; saveSettings(); return renderTodo(); }
    if (d.todoDel) { S.todos = TODOS().filter(x => x.id !== task.id); saveSettings(); return renderTodo(); }
  });

  // ---------- Privat: Tagesplan ----------
  const DAY_CATS = [["Routine", "--seg-other"], ["Gesundheit", "--seg-profit"], ["Lernen", "--seg-ship"], ["Arbeit", "--seg-make"], ["Essen", "--seg-fee"], ["Freizeit", "--seg-time"]];
  const DAY_TYPES = [["all", "täglich"], ["wt", "Mo–Fr"], ["we", "Sa–So"]];
  const tmin = s => { const m = String(s || "").match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : NaN; };
  const tfmt = n => String(Math.floor(n / 60) % 24).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");
  const dur = b => { const d = tmin(b.to) - tmin(b.from); return isFinite(d) ? d : NaN; };
  const durTxt = m => !isFinite(m) ? "–" : m >= 60 ? `${Math.floor(m / 60)} Std${m % 60 ? " " + (m % 60) + " Min" : ""}` : `${m} Min`;
  // Startplan nach deinen Angaben. Annahmen (grau markiert, änderbar): 08:15 bis 09:00 Puffer, Heimweg, Abendroutine.
  const dayDefault = () => [
    ["07:00", "07:15", "Aufstehen, fertig machen", "Routine", "all"], ["07:15", "07:45", "Sport", "Gesundheit", "all"], ["07:45", "08:15", "Englisch lernen", "Lernen", "all"],
    ["08:15", "09:00", "Duschen, Kaffee, Puffer", "Routine", "all", "Annahme: Zeit bis zum Büro, ändere sie nach Bedarf."], ["09:00", "11:00", "Büro", "Arbeit", "wt"], ["11:00", "11:30", "Frühstück", "Essen", "all"],
    ["11:30", "17:00", "Werkstatt", "Arbeit", "wt"], ["17:00", "17:30", "Heimweg", "Routine", "wt", "Annahme: 30 Minuten."], ["17:30", "18:30", "Kochen und Essen", "Essen", "all"],
    ["18:30", "22:00", "Freizeit", "Freizeit", "all"], ["22:00", "22:30", "Runterkommen, Schlafen gehen", "Routine", "all", "Annahme: für etwa 8 Stunden Schlaf bis 07:00."]
  ].map(([from, to, t, cat, days, note]) => ({ id: uid(), from, to, t, cat, days, note: note || "" }));
  const DAYPLAN = () => { if (!S.dayPlan || !Array.isArray(S.dayPlan.blocks)) S.dayPlan = { blocks: dayDefault() }; return S.dayPlan.blocks; };
  let dayView = LS.get("hlz-app-dayview") || (([0, 6].includes(new Date().getDay())) ? "we" : "wt"), dayResetAsk = false, dayTimer = null;
  const dayApplies = (b, v2) => b.days === "all" || !b.days || b.days === v2;
  const dayBlocks = () => DAYPLAN().filter(b => dayApplies(b, dayView)).sort((x, y) => (tmin(x.from) || 0) - (tmin(y.from) || 0));
  const dayStreak = () => {
    const done = S.dayDone || {}; let n = 0, d = new Date();
    const hit = iso => (done[iso] || []).some(id => { const b = DAYPLAN().find(x => x.id === id); return b && /sport/i.test(b.t); });
    if (!hit(isoD(d))) d.setDate(d.getDate() - 1);
    while (hit(isoD(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };
  function renderDay() {
    const bl = dayBlocks(), td = todayISO(), now = new Date(), nm = now.getHours() * 60 + now.getMinutes(), isToday = (dayView === "all") || (([0, 6].includes(now.getDay())) ? "we" : "wt") === dayView;
    const doneToday = new Set((S.dayDone || {})[td] || []);
    const cur = isToday ? bl.find(b => tmin(b.from) <= nm && nm < tmin(b.to)) : null, next = isToday ? bl.find(b => tmin(b.from) > nm) : null;
    // Summen, Überschneidungen, Lücken
    const sums = {}; let gaps = [], over = [];
    bl.forEach((b, i) => { const d = dur(b); if (isFinite(d) && d > 0) sums[b.cat] = (sums[b.cat] || 0) + d; if (i > 0) { const g = tmin(b.from) - tmin(bl[i - 1].to); if (g > 15) gaps.push(`${bl[i - 1].to} bis ${b.from} (${durTxt(g)})`); if (g < 0) over.push(`${bl[i - 1].t} und ${b.t}`); } if (!(d > 0)) over.push(`${b.t}: Ende liegt nicht nach dem Start`); });
    const sleep = bl.length ? 24 * 60 - tmin(bl[bl.length - 1].to) + tmin(bl[0].from) : NaN;
    const doneN = bl.filter(b => doneToday.has(b.id)).length, streak = dayStreak();
    const row = b => { const c = (DAY_CATS.find(x => x[0] === b.cat) || DAY_CATS[0])[1], isNow = cur && cur.id === b.id;
      return `<div class="dayrow${isNow ? " now" : ""}${doneToday.has(b.id) ? " done" : ""}" style="border-left:4px solid var(${c})">
        <input type="checkbox" data-day="done|${b.id}" ${doneToday.has(b.id) ? "checked" : ""} aria-label="heute erledigt" title="Heute erledigt" ${isToday ? "" : "disabled"}>
        <div class="inp"><input type="time" data-day="from|${b.id}" value="${esc(b.from)}" aria-label="Von"></div><div class="inp"><input type="time" data-day="to|${b.id}" value="${esc(b.to)}" aria-label="Bis"></div>
        <span class="note daydur">${durTxt(dur(b))}</span>
        <div class="inp"><input type="text" data-day="t|${b.id}" value="${esc(b.t)}" aria-label="Titel">${b.note ? "" : ""}</div>
        <div class="inp"><select data-day="cat|${b.id}" aria-label="Kategorie">${DAY_CATS.map(([k]) => `<option ${k === b.cat ? "selected" : ""}>${k}</option>`).join("")}</select></div>
        <div class="inp"><select data-day="days|${b.id}" aria-label="Tage">${DAY_TYPES.map(([k, l]) => `<option value="${k}" ${(b.days || "all") === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <button type="button" class="btn" data-day-del="${b.id}" aria-label="Löschen">×</button>${b.note ? `<span class="note daynote">${esc(b.note)}</span>` : ""}</div>`; };
    $("view").innerHTML = `${privBar("tag")}<div class="row"><h1>Tagesplan</h1><div class="seg" aria-label="Plan für"><button type="button" data-day-view="wt" aria-pressed="${dayView === "wt"}">Werktag (Mo–Fr)</button><button type="button" data-day-view="we" aria-pressed="${dayView === "we"}">Wochenende</button></div></div>
      <p class="note">Dein Tag in Blöcken. Zeiten, Namen, Kategorien und die Tage änderst du direkt in der Zeile. Mit dem Haken markierst du heute erledigte Blöcke. Grau hinterlegte Hinweise sind Annahmen von mir, wo du keine Zeit genannt hattest.</p>
      <section class="box"><div class="tiles t3">
        <div class="tile"><span class="label">Jetzt</span><span class="num" style="font-size:1.15rem">${cur ? esc(cur.t) : isToday ? "frei" : "–"}</span><span class="note">${cur ? `bis ${esc(cur.to)}` : next ? `als Nächstes: ${esc(next.t)} um ${esc(next.from)}` : isToday ? "Der Plan für heute ist durch." : "Du siehst gerade den Plan für einen anderen Tag."}</span></div>
        <div class="tile"><span class="label">Heute geschafft</span><span class="num" style="font-size:1.15rem">${isToday ? `${doneN} von ${bl.length}` : "–"}</span><span class="note">${streak ? `Sport-Serie: ${streak} ${streak === 1 ? "Tag" : "Tage"} in Folge` : "Haken bei „Sport“ setzen, dann zählt die Serie."}</span></div>
        <div class="tile"><span class="label">Schlaf</span><span class="num" style="font-size:1.15rem">${isFinite(sleep) ? durTxt(sleep) : "–"}</span><span class="note">vom letzten Block bis zum ersten am nächsten Morgen</span></div>
      </div></section>
      <section class="box" style="margin-top:12px"><div class="dayhead"><span></span><span>Von</span><span>Bis</span><span>Dauer</span><span>Block</span><span>Kategorie</span><span>Tage</span><span></span></div>
        ${bl.length ? bl.map(row).join("") : `<p class="note">Für diesen Tagestyp gibt es noch keine Blöcke.</p>`}
        <div class="btns" style="margin-top:8px"><button type="button" class="btn" data-day-add>+ Block</button>${dayResetAsk ? `<span><strong>Plan wirklich zurücksetzen?</strong> <button type="button" class="btn danger" data-day-reset="yes">Ja</button> <button type="button" class="btn" data-day-reset="no">Nein</button></span>` : `<button type="button" class="btn" data-day-reset="ask">Plan zurücksetzen</button>`}</div></section>
      <section class="box" style="margin-top:12px"><h2>Auswertung</h2>
        ${anaTable(["Kategorie", "Zeit pro Tag"], DAY_CATS.filter(([k]) => sums[k]).map(([k, c]) => [`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(${c});margin-right:6px"></span>${k}`, durTxt(sums[k])]), [1])}
        ${over.length ? `<p style="color:var(--bad)"><strong>Überschneidung:</strong> ${esc(over.join(", "))}.</p>` : ""}
        ${gaps.length ? `<p class="note">Freie Lücken über 15 Minuten: ${esc(gaps.join(" · "))}. Füll sie mit einem Block oder lass sie als Puffer.</p>` : ""}</section>`;
  }
  const daySoon = () => { clearTimeout(dayTimer); dayTimer = setTimeout(() => { if (view !== "tag") return; if (typing()) return daySoon(); const sy = window.scrollY; renderDay(); window.scrollTo(0, sy); }, 700); };
  setInterval(() => { if (view === "tag" && !typing()) renderDay(); }, 60000);   // „Jetzt“ bleibt aktuell
  document.addEventListener("change", e => {
    if (view !== "tag") return; const el = e.target, d = el.dataset.day; if (!d) return;
    const [f, id] = d.split("|"), b = DAYPLAN().find(x => x.id === id); if (!b) return;
    if (f === "done") { S.dayDone = S.dayDone || {}; const td = todayISO(), set = new Set(S.dayDone[td] || []); el.checked ? set.add(id) : set.delete(id); S.dayDone[td] = [...set]; Object.keys(S.dayDone).sort().slice(0, -60).forEach(k => delete S.dayDone[k]); saveSettings(); return renderDay(); }
    if (f === "from" || f === "to") { if (!isFinite(tmin(el.value))) return; b[f] = el.value; saveSettings(); el.dataset.pending = "1"; return; }
    b[f] = el.value; saveSettings(); (f === "t") ? daySoon() : renderDay();
  });
  document.addEventListener("focusout", e => { if (view === "tag" && e.target.dataset && e.target.dataset.pending) { delete e.target.dataset.pending; renderDay(); } });
  document.addEventListener("click", e => {
    if (view !== "tag") return;
    const t = e.target.closest("[data-day-add],[data-day-del],[data-day-view],[data-day-reset]"); if (!t) return; const d = t.dataset;
    if (d.dayView) { dayView = d.dayView; LS.set("hlz-app-dayview", dayView); return renderDay(); }
    if (d.dayAdd !== undefined) { const bl = dayBlocks(), last = bl.length ? tmin(bl[bl.length - 1].to) : 8 * 60, s = isFinite(last) ? last : 8 * 60; DAYPLAN().push({ id: uid(), from: tfmt(s), to: tfmt(s + 30), t: "Neuer Block", cat: "Routine", days: dayView === "all" ? "all" : dayView, note: "" }); saveSettings(); return renderDay(); }
    if (d.dayDel) { S.dayPlan.blocks = DAYPLAN().filter(x => x.id !== d.dayDel); saveSettings(); return renderDay(); }
    if (d.dayReset === "ask") { dayResetAsk = true; return renderDay(); }
    if (d.dayReset === "no") { dayResetAsk = false; return renderDay(); }
    if (d.dayReset === "yes") { dayResetAsk = false; S.dayPlan = { blocks: dayDefault() }; saveSettings(); return renderDay(); }
  });

  // ---------- Start ----------
  async function boot() {
    setTimeout(() => { const l = document.querySelector("#view .loading"); if (l) l.innerHTML = 'Lädt länger als gewöhnlich … <a href="">Neu laden</a>'; }, 15000);
    store = Local; mode = "local";
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const db = await Promise.race([window.claude.use("db"), new Promise(r => setTimeout(() => r(null), 10000))]);
        if (db) { store = Cloud(db); mode = "cloud"; }
      } catch (e) {}
    }
    let data;
    try { data = await store.load(); }
    catch (e) { store = Local; mode = "local"; data = await Local.load(); toast("Online-Speicher nicht erreichbar, arbeite lokal."); }
    if (!data.settings && !data.articles.length) {
      // Erster Start: lokale Daten (gleicher Browser) oder Vorversion übernehmen
      let seed = mode === "cloud" ? await Local.load() : null;
      if (!seed || (!seed.settings && !seed.articles.length)) seed = migrateV2();
      if (seed && (seed.settings || seed.articles.length)) {
        S = { ...SETTINGS_DEFAULT(), ...(seed.settings || {}) }; A = seed.articles || [];
        saveSettings(); A.forEach(saveArticle);
        if (A.length) toast(`${A.length} Artikel aus der Vorversion übernommen`);
      }
    } else {
      S = { ...SETTINGS_DEFAULT(), ...clone(data.settings || {}) }; A = data.articles || [];
    }
    try { SUP = await store.loadSupport(); } catch (e) { SUP = []; }
    try { ORD = await store.loadOrders(); } catch (e) { ORD = []; }
    try { await ordBbMerge(); } catch (e) {}
    ordBadge();
    setSync("ok");
    route();
    if (store.subscribe) store.subscribe(liveArticles, liveSettings);
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !(window.claude)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  boot();
})();
</script>
</body>
