<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5a46">
<link rel="apple-touch-icon" href="icon-192.png">
<!--/pwa-->
<title>HLZ Margenrechner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Werkbank-App – Kopfleiste mit Reitern; Übersicht = Artikeltabelle mit Monatsergebnis; Artikel = Eingaben links, Ergebnis-Zettel rechts (sticky) */
:root {
  --bg: #f3f1ec;          /* Birkensperrholz */
  --panel: #fbfaf7;
  --line: #ddd8cd;
  --fg: #23201b;
  --muted: #6c665b;
  --accent: #2f5a46;      /* Werkstattgrün */
  --accent-soft: #dfe9e2;
  --on-accent: #fbfaf7;
  --walnut: #7a4b2a;
  --good: #2e7d4f; --warn: #b7791f; --bad: #b3412f;
  --seg-vat: #a8a195; --seg-fee: #c9813f; --seg-make: #7a4b2a; --seg-ship: #4f7896; --seg-pack: #9c8a6b; --seg-time: #8a6fa3; --seg-other: #7d7d7d; --seg-profit: #2e7d4f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1916; --panel: #23221e; --line: #3a372f; --fg: #ece8df; --muted: #a39d90;
  --accent: #7fb89a; --accent-soft: #24342b; --on-accent: #1a1916; --walnut: #c99467;
  --good: #5cbf85; --warn: #e0a84a; --bad: #e07a66;
  --seg-vat: #6f6a60; --seg-fee: #d89452; --seg-make: #b07a4f; --seg-ship: #6d9cc0; --seg-pack: #b3a17f; --seg-time: #a68cc0; --seg-other: #8f8f8f; --seg-profit: #5cbf85;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a1916; --panel: #23221e; --line: #3a372f; --fg: #ece8df; --muted: #a39d90;
  --accent: #7fb89a; --accent-soft: #24342b; --on-accent: #1a1916; --walnut: #c99467;
  --good: #5cbf85; --warn: #e0a84a; --bad: #e07a66;
  --seg-vat: #6f6a60; --seg-fee: #d89452; --seg-make: #b07a4f; --seg-ship: #6d9cc0; --seg-pack: #b3a17f; --seg-time: #a68cc0; --seg-other: #8f8f8f; --seg-profit: #5cbf85;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0 }
h1 { font-size: 1.6rem; letter-spacing: -0.01em }
h2 { font-size: 1.15rem }
h3 { font-size: 1rem }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.note { font-size: .8rem; color: var(--muted); margin: 0 }
.ph { color: var(--warn); font-size: .8rem; margin: 0 }
.inp.est { box-shadow: 0 0 0 2px var(--warn) }
.inp.chsel { display: inline-flex; width: auto; max-width: 100%; margin-bottom: 10px }
.savenear { display: block; margin: 12px 0 0 auto; padding: 7px 16px; font-size: .88rem }
label.check { margin-top: 10px; font-weight: 600 }
label.check small { font-weight: 400; color: var(--muted) }

/* Kopfleiste */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
.top .wrap { grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0 }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--walnut); color: var(--panel); display: grid; place-items: center; font: 700 .8rem var(--font-display); flex: none }
.brand strong { font-family: var(--font-display); font-size: 1.05rem; white-space: nowrap }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .9rem; padding: 6px 12px; border-radius: 999px }
nav.tabs a[aria-current=page] { background: var(--accent-soft); color: var(--accent) }
.sync { font-size: .75rem; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good) }
.sync.saving .dot { background: var(--warn) } .sync.err .dot { background: var(--bad) }
@media (max-width: 720px) {
  .top .wrap { grid-template-columns: 1fr auto; row-gap: 6px }
  nav.tabs { grid-column: 1 / -1; justify-content: flex-start; order: 3 }
}
main.wrap { padding-block: 20px 48px }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start }
.stack { display: grid; gap: 18px; min-width: 0 }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr) } }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px }
@media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr) } .grid3.keep { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.field { display: grid; gap: 4px; min-width: 0; align-content: start }
.field label { font-size: .82rem; color: var(--muted) }
.field small { color: var(--muted); font-size: .74rem }
.inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.inp input, .inp select { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 9px 10px; font: 500 .95rem var(--font-mono); outline: none }
.inp input[type=text], .inp input[type=search], .inp select { font-family: var(--font-body) }
.inp span { padding: 0 10px; color: var(--muted); font-size: .85rem }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button, .btn { font: 500 .85rem var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 7px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.seg button[aria-pressed=true], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn:hover, .seg button:hover { border-color: var(--accent) }
.btn:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.check { display: flex; gap: 8px; align-items: center; font-size: .88rem }
.check input { accent-color: var(--accent); width: 16px; height: 16px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between }
.btns { display: flex; gap: 8px; flex-wrap: wrap }

/* Zeilenlisten */
.rows { display: grid; gap: 8px }
.rowhead, .rowline { display: grid; gap: 8px; align-items: center }
.rowhead { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.rowline .inp input, .rowline .inp select { padding: 7px 8px; font-size: .88rem }
.rowline .out { font-family: var(--font-mono); font-size: .85rem; text-align: right; color: var(--muted) }
.c-parts { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.6fr) minmax(0, .9fr) minmax(0, .9fr) minmax(0, .7fr) 32px }
.c-2 { grid-template-columns: minmax(0, 2.5fr) minmax(0, 1.2fr) 32px }
.c-plates { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, .8fr) 32px }
.c-ship { grid-template-columns: minmax(0, 2fr) repeat(5, minmax(0, 1fr)) 32px }
.c-blank { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)) 32px }
.c-box { grid-template-columns: minmax(0, 2fr) repeat(5, minmax(0, 1fr)) 32px }
.rowline.chosen .inp:first-child { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.rows .inp span { padding: 0 6px 0 0; font-size: .75rem }
.x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem }
.x:hover { color: var(--bad); border-color: var(--bad) }
.add { justify-self: start; font-size: .82rem; padding: 5px 12px }
.sumline { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; font-size: .88rem }
.sumline strong { font-family: var(--font-mono); font-weight: 500 }
/* Listen stapeln, sobald ihre Box schmal ist (Handy, aber auch die halbe Desktop-Spalte) */
.rows { container-type: inline-size }
@container (max-width: 640px) {
  .rowhead.c-parts, .rowhead.c-ship, .rowhead.c-plates, .rowhead.c-box, .rowhead.c-blank { display: none }
  .rowline.c-parts, .rowline.c-ship, .rowline.c-plates, .rowline.c-box, .rowline.c-blank { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 8px; border-bottom: 1px dashed var(--line) }
  .rowline.c-ship > :first-child, .rowline.c-plates > :first-child, .rowline.c-box > :first-child { grid-column: 1 / -1 }
  .rowline.c-blank { grid-template-areas: "n n x" "l h t" }
  .rowline.c-blank > :nth-child(1) { grid-area: n } .rowline.c-blank > :nth-child(2) { grid-area: l } .rowline.c-blank > :nth-child(3) { grid-area: h }
  .rowline.c-blank > :nth-child(4) { grid-area: t } .rowline.c-blank > :nth-child(5) { grid-area: x; justify-self: end }
  .rowline.c-box { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "n n x" "l b h" "g p p" }
  .rowline.c-box > :nth-child(1) { grid-area: n } .rowline.c-box > :nth-child(2) { grid-area: l } .rowline.c-box > :nth-child(3) { grid-area: b }
  .rowline.c-box > :nth-child(4) { grid-area: h } .rowline.c-box > :nth-child(5) { grid-area: g } .rowline.c-box > :nth-child(6) { grid-area: p } .rowline.c-box > :nth-child(7) { grid-area: x; justify-self: end }
  /* Zuschnitt am Handy: Name + Entfernen, darunter Platte, darunter Maße */
  .rowline.c-parts { grid-template-areas: "n n x" "p p p" "l b q" }
  .rowline.c-parts > :nth-child(1) { grid-area: n } .rowline.c-parts > :nth-child(2) { grid-area: p }
  .rowline.c-parts > :nth-child(3) { grid-area: l } .rowline.c-parts > :nth-child(4) { grid-area: b }
  .rowline.c-parts > :nth-child(5) { grid-area: q } .rowline.c-parts > :nth-child(6) { grid-area: x }
  .rowline .x { justify-self: end }
}

/* Ergebnis-Zettel */
.result { position: sticky; top: calc(var(--toph, 60px) + 64px) }
/* Artikelname bleibt beim Scrollen oben stehen */
.arthead { position: sticky; top: var(--toph, 60px); z-index: 4; display: flex; min-width: 0; align-items: center; gap: 10px; margin: 0 -16px; padding: 8px 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line) }
.arthead strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1rem }
.arthead .sku { color: var(--muted); font: .78rem var(--font-mono); white-space: nowrap }
.arthead .num { font-family: var(--font-mono); font-size: .9rem; white-space: nowrap }
@media (max-width: 520px) { .arthead .sku { display: none } .arthead strong { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: .92rem } .arthead .num { font-size: .8rem } }
@media (max-width: 860px) { .result { position: static } }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.big .num { font-size: 2.3rem; font-weight: 500; line-height: 1 }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap }
.pill.good { color: var(--good) } .pill.warn { color: var(--warn) } .pill.bad { color: var(--bad) } .pill.muted { color: var(--muted) }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.kpi { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; min-width: 0 }
.kpi .num { font-size: 1.1rem }
.bar { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--line) }
.bar div { height: 100% }
.legend { display: grid; gap: 4px; font-size: .84rem }
.legend .lrow { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center }
.legend .sw { width: 10px; height: 10px; border-radius: 2px }
.legend .pct { color: var(--muted); width: 3.6em; text-align: right }
.shipinfo { display: grid; gap: 4px; font-size: .88rem; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft) }
.tip { color: var(--walnut) } .warn { color: var(--bad) }

/* Übersicht */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; min-width: 0 }
.tile .num { font-size: 1.35rem }
.tile.hero { border-color: var(--accent) }
.tablewrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 640px }
table.imp { min-width: 520px }
.show-sm { display: none }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
th:first-child, td:first-child { text-align: left }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.star { background: none; border: 0; padding: 0 6px 0 0; font-size: 1.15rem; line-height: 1; color: var(--line); cursor: pointer; vertical-align: -1px }
.star[aria-pressed=true] { color: var(--warn) } .star:hover { color: var(--warn) }
.btn.star-btn[aria-pressed=true] { color: var(--warn); border-color: var(--warn) }
th button { all: unset; cursor: pointer } th button:hover, th button[aria-pressed=true] { color: var(--accent) }
tbody tr.click { cursor: pointer } tbody tr.click:hover td { background: var(--accent-soft) }
td.name { white-space: normal; min-width: 180px }
td.name strong { font-weight: 600 }
.chip { display: inline-block; font-size: .68rem; border-radius: 4px; padding: 0 5px; margin: 2px 4px 0 0; border: 1px solid currentColor }
.status { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 10px 14px; border-radius: 10px; border: 1px solid; font-size: .9rem; font-weight: 600 }
.status.open { border-color: var(--warn); color: var(--warn) } .status.done { border-color: var(--good); color: var(--good) }
.status .note { font-weight: 400; flex-basis: 100% } .status button.chip { background: none; font: inherit; font-size: .8rem; padding: 2px 8px; margin: 0 }
.chip.ex { color: var(--walnut) } .chip.miss { color: var(--warn); cursor: pointer }
tr.best td:first-child::after { content: " · bester"; color: var(--good); font-size: .75rem; font-weight: 600 }
.empty { text-align: center; padding: 36px 16px; display: grid; gap: 12px; justify-items: center }
.empty p { max-width: 46ch; color: var(--muted); margin: 0 }
.banner { border: 1px solid var(--warn); color: var(--fg); background: var(--panel); border-radius: 10px; padding: 10px 14px; font-size: .88rem; display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted) }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: .85rem; z-index: 20; max-width: calc(100% - 32px) }
details summary { cursor: pointer; color: var(--muted); font-size: .85rem }
details ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: .84rem; display: grid; gap: 4px }
@media (max-width: 600px) {
  table.ov { min-width: 0 } .hide-sm { display: none } .show-sm { display: inline }
  table.ov td.name { min-width: 0 }
  table.imp, table.imp tbody, table.imp tr, table.imp td { display: block } table.imp { min-width: 0 } table.imp thead { display: none }
  table.imp tr { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; border-bottom: 1px solid var(--line); padding: 10px 0 }
  table.imp td { border: 0; padding: 0 } table.imp td:last-child { grid-column: 1 / -1 }
}
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--panel); border-top: 2px solid var(--accent); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -6px 20px rgb(0 0 0 / .12) }
.savebar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 10px }
.savebar .btn { padding: 9px 18px; font-size: .95rem }
body.dirty main.wrap { padding-bottom: 120px }
body.dirty .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)) }
.loading { padding: 60px 0; text-align: center; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { .bar div { transition: width .25s ease } }
</style>
</head>
<body>
<header class="top gutter">
  <div class="wrap">
    <a class="brand" href="#uebersicht" style="text-decoration:none;color:inherit"><span class="logo" aria-hidden="true">HLZ</span><strong>Margenrechner</strong></a>
    <nav class="tabs" aria-label="Bereiche">
      <a href="#uebersicht" data-tab="uebersicht">Dashboard</a>
      <a href="#einstellungen" data-tab="einstellungen">Einstellungen</a>
      <a href="#import" data-tab="import">Import</a>
    </nav>
    <span class="sync" id="sync" title=""><span class="dot"></span><span id="syncText">Lade …</span></span>
  </div>
</header>
<script>
  // Höhe der Kopfzeile für die einrastende Artikelzeile
  new ResizeObserver(([e]) => document.documentElement.style.setProperty("--toph", e.target.offsetHeight + "px")).observe(document.querySelector("header.top"));
</script>
<main class="wrap gutter" id="view"><div class="loading">Lade deine Artikel …</div></main>
<div class="toast" id="toast" hidden></div>
<div class="savebar" id="savebar" hidden>
  <div class="wrap gutter"><span><strong>Nicht gespeichert</strong> <span class="note">Änderungen gehen sonst verloren</span></span>
    <span class="btns"><button class="btn" data-act="discard">Verwerfen</button><button class="btn primary" data-act="save">Speichern</button></span></div>
</div>

<script>
(() => {
  // ---------- Helfer ----------
  const $ = id => document.getElementById(id);
  const v = x => { const f = parseFloat(String(x ?? "").replace(",", ".")); return isFinite(f) ? f : 0; };
  const eur = x => !isFinite(x) ? "–" : (x < 0 ? "−" : "") + Math.abs(x).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  const eur0 = x => !isFinite(x) ? "–" : (x < 0 ? "−" : "") + Math.abs(x).toLocaleString("de-DE", { maximumFractionDigits: 0 }) + " €";
  const pct = x => isFinite(x) ? (x < 0 ? "−" : "") + Math.abs(x).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %" : "–";
  const dec = (x, d = 1) => x.toLocaleString("de-DE", { maximumFractionDigits: d });
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  const kg = g => dec(g / 1000, 2) + " kg";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = x => JSON.parse(JSON.stringify(x));

  // Günstigster Karton, in den der größte Rohling passt (1 cm Luft je Maß)
  function suggestBox(a) {
    const parts = (a.parts || []).filter(p => v(p.l) * v(p.b) > 0);
    if (!parts.length) return null;
    const t = parts.reduce((s, p) => Math.max(s, v(((S.blanks || []).find(b => b.n === p.blank) || {}).t) || 2), 0);
    const need = [Math.max(...parts.map(p => v(p.l))), Math.max(...parts.map(p => v(p.b))), t].sort((x, y) => y - x);
    const fits = (S.boxes || []).filter(b => b.n).filter(b => { const inner = [v(b.l), v(b.b), v(b.h)].sort((x, y) => y - x).map(x => x - 1); return need.every((n, i) => n <= inner[i]); });
    const cost = b => { const r = pickShip({ ...a, pkL: b.l, pkB: b.b, pkH: b.h, shipMode: "auto" }); return v(b.p) + (r.best ? r.best.price : 99); };
    return fits.sort((x, y) => cost(x) - cost(y))[0] || null;
  }
  function updateEditor(a) {
    const ctx = volume(), r = calc(a, a.chan, undefined, ctx);
    const miss = missing(a), mb = $("missBox");
    $("ahName").textContent = a.name || "Ohne Namen"; $("ahSku").textContent = a.sku || "";
    $("ahProfit").textContent = isFinite(r.profit) ? eur(r.profit) + " · " + pct(r.margin) : "";
    $("ahProfit").style.color = r.profit < 0 ? "var(--bad)" : "";
    $("secWood").hidden = $("secMach").hidden = !!a.fremd;
    $("extBox").hidden = !a.fremd;
    mb.className = "status " + (miss.length ? "open" : "done");
    mb.innerHTML = miss.length
      ? `<span>⚠ Noch offen:</span> ${miss.map(x => `<button type="button" class="chip miss" data-jump="${x}">${x}</button>`).join("")}<span class="note">Sind alle Punkte erledigt, kommt der Artikel beim Speichern nach ✓ Fertig.</span>`
      : `<span>✓ Vollständig</span><span class="note">${dirty ? "Beim Speichern kommt der Artikel nach ✓ Fertig." : "Liegt im Ordner ✓ Fertig."}</span>`;
    const pl = S.plates.find(x => x.n === ((a.parts || [])[0] || {}).plate) || S.plates[0];
    const m2 = pl && v(pl.l) * v(pl.b) > 0 ? v(pl.p) / (v(pl.l) * v(pl.b) / 10000) : 0;
    const perPlate = pl && r.partsM2 > 0 ? Math.floor((v(pl.l) * v(pl.b) / 10000) / (r.partsM2 * (1 + v(a.waste) / 100))) : 0;
    $("woodInfo").textContent = r.partsM2 > 0 ? `${dec(r.partsM2, 3)} m² · ${eur(m2)}/m² · ca. ${perPlate} Stück pro Platte` : "Zuschnitt eintragen";

  // Umbenennen in Stammdaten: Verweise in allen Artikeln mitziehen
  function renameRef(kind, oldN, newN) {
    if (!oldN || oldN === newN) return;
    A.forEach(a => {
      let ch = false;
      if (kind === "plate") (a.parts || []).forEach(p => { if (p.plate === oldN) { p.plate = newN; ch = true; } });
      if ((kind === "small" || kind === "mach") && a[kind] && oldN in a[kind]) { a[kind][newN] = a[kind][oldN]; delete a[kind][oldN]; ch = true; }
      if (kind === "ship" && a.shipMode === oldN) { a.shipMode = newN; ch = true; }
      if (kind === "box" && a.box === oldN) { a.box = newN; ch = true; }
      if (kind === "blank") (a.parts || []).forEach(p => { if (p.blank === oldN) { p.blank = newN; p.n = newN; ch = true; } });
      if (ch) saveArticle(a);
    });
  }

      case "parse": return runImport();
      case "applyImport": return applyImport();
      case "cancelImport": imp = null; return renderImport();
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.open) go("artikel-" + e.target.dataset.open); });

  // ---------- Sicherung ----------
  async function exportData() {
    const json = JSON.stringify({ app: "hlz-margenrechner", version: 3, saved: new Date().toISOString(), settings: S, articles: A }, null, 1);
    const name = "hlz-margen-" + new Date().toISOString().slice(0, 10) + ".json";
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: name, data: json }); return toast("Sicherung gespeichert"); }
    } catch (e) { /* abgelehnt oder nicht verfügbar → Fallback */ }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const l = document.createElement("a"); l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {}
    const out = $("exportOut"); if (out) { out.value = json; out.hidden = false; }
    toast("Falls kein Download startet: Text unten kopieren und als .json speichern");
  }
  function restore(e) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.articles) || !d.settings) throw 0;
        A.slice().forEach(x => removeArticle(x.id));
        S = { ...SETTINGS_DEFAULT(), ...d.settings }; saveSettings(); setDirty(false);
        A = d.articles.map(x => ({ ...x, id: x.id || uid() })); A.forEach(saveArticle);
        toast(`${A.length} Artikel eingespielt`); go("uebersicht");
      } catch (err) { toast("Das ist keine Sicherung aus dieser App."); }
    };
    r.readAsText(f);
  }

  // ---------- CSV-Import ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((x, y) => y[1] - x[1])[0][0];
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim() !== ""));
  }
  function money(s) {
    s = String(s ?? "").replace(/[^\d,.\-]/g, ""); if (!s) return NaN;
    const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
    s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    return parseFloat(s);
  }
  function pdate(s) {
    s = String(s || "").trim(); let m;
    const yr = t => t.length === 2 ? 2000 + +t : +t;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], m[2] - 1, +m[3]);
    if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))) return new Date(yr(m[3]), m[2] - 1, +m[1]);
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return new Date(yr(m[3]), m[1] - 1, +m[2]); // Etsy: MM/DD/YY
    const d = new Date(s); return isNaN(d) ? null : d;
  }
  // Spaltennamen der Exporte (klein geschrieben), mit deutschen Varianten
  const COLS = {
    name: ["item name", "lineitem name", "item title", "artikelbezeichnung", "artikelname", "artikel", "produkt", "produktname", "title", "titel"],
    qty: ["quantity", "lineitem quantity", "menge", "anzahl", "stückzahl"],
    price: ["price", "lineitem price", "sold for", "verkauft für", "preis", "artikelpreis", "einzelpreis"],
    date: ["sale date", "created at", "paid at", "verkaufsdatum", "datum", "bestelldatum", "order date"],
    variation: ["variations", "variationen", "variante"],
    sku: ["sku", "lineitem sku", "variant sku", "bestandseinheit", "custom label", "artikelnummer (sku)"],
    order: ["order id", "name", "bestellnummer", "order"],
    status: ["financial status"]
  };
  const findCol = (hdr, keys) => { for (const k of keys) { const i = hdr.indexOf(k); if (i >= 0) return i; } return -1; };
  function detect(hdr) {
    const has = k => hdr.includes(k);
    if (has("lineitem name") && has("lineitem quantity")) return { type: "shopifyOrders", ch: "shopify", label: "Shopify Bestellungen" };
    if (has("handle") && has("variant price")) return { type: "shopifyProducts", ch: "shopify", label: "Shopify Produkte" };
    if (has("item name") && has("quantity")) return { type: "etsyItems", ch: "etsy", label: "Etsy verkaufte Artikel" };
    if ((has("item title") && has("quantity")) || (has("artikelbezeichnung") && has("anzahl"))) return { type: "ebayOrders", ch: "ebay", label: "eBay Bestellungen" };
    if ((has("title") && has("tags") && has("price")) || (has("titel") && has("tags") && has("preis"))) return { type: "etsyListings", ch: "etsy", label: "Etsy Angebote" };
    if (has("number of items") || has("order value")) return { type: "etsyOrders", ch: "etsy", label: "Etsy Bestellungen (ohne Artikel)" };
    return { type: "generic", ch: "etsy", label: "Unbekanntes Format" };
  }
  let imp = null;   // laufender Import: { files: [...], split: bool }
  function renderImport() {
    if (imp) return renderImportPreview();
    $("view").innerHTML = `
      <h1>Bestellungen importieren</h1>
      <section class="box">
        <div class="drop" id="drop">
          <strong style="color:var(--fg)">CSV-Dateien hier ablegen</strong>
          <span>oder</span>
          <label class="btn primary" for="csvFiles">Dateien auswählen</label><input type="file" id="csvFiles" accept=".csv,text/csv,.txt" multiple hidden>
        </div>
        <details open><summary>Welche Dateien?</summary><ul>
          <li><strong>Etsy:</strong> Shop-Manager → Einstellungen → Optionen → Daten herunterladen → Art: <em>Bestellte Artikel</em> (EtsySoldOrderItems). Die Datei „Bestellungen“ enthält keine Artikelnamen.</li>
          <li><strong>eBay:</strong> Verkäufer-Cockpit → Bestellungen → Berichte herunterladen → Bestellungen (CSV).</li>
          <li><strong>Shopify:</strong> Bestellungen → Exportieren → alle Bestellungen als CSV. Optional zusätzlich Produkte → Exportieren für Preise und Gewichte.</li>
          <li>Mehrere Dateien gleichzeitig gehen. Ein neuer Import ersetzt die Verkaufszahlen des jeweiligen Kanals.</li>
          <li>Gespeichert werden nur Artikelnamen, Stückzahlen, Durchschnittspreise und Zeitraum, keine Kundendaten.</li>
        </ul></details>
      </section>`;
    const drop = $("drop"), inp = $("csvFiles");
    inp.addEventListener("change", () => readFiles(inp.files));
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => readFiles(e.dataTransfer.files));
  }
  function readFiles(list) {
    const files = [...list]; if (!files.length) return;
    Promise.all(files.map(f => f.text().then(text => ({ file: f.name, text })))).then(res => {
      imp = { split: false, files: res.map(({ file, text }) => {
        let rows = parseCSV(text);
        // Kopfzeile suchen: eBay-Berichte haben vorab Leer- oder Infozeilen
        const hi = rows.slice(0, 15).findIndex(r => r.some(c => COLS.name.includes(norm(c)) || ["lineitem name", "handle", "title"].includes(norm(c))));
        if (hi > 0) rows = rows.slice(hi);
        const hdr = (rows[0] || []).map(h => norm(h));
        const fmt = detect(hdr);
        const map = { name: findCol(hdr, COLS.name), qty: findCol(hdr, COLS.qty), price: findCol(hdr, COLS.price), date: findCol(hdr, COLS.date), variation: findCol(hdr, COLS.variation), sku: findCol(hdr, COLS.sku) };
        if (fmt.type === "shopifyOrders") Object.assign(map, { name: hdr.indexOf("lineitem name"), qty: hdr.indexOf("lineitem quantity"), price: hdr.indexOf("lineitem price"), date: findCol(hdr, ["created at", "paid at"]) });
        if (fmt.type === "etsyListings") map.name = hdr.indexOf("title") >= 0 ? hdr.indexOf("title") : hdr.indexOf("titel");
        return { file, rows, hdr, rawHdr: rows[0] || [], fmt, ch: fmt.ch, map, months: null };
      }) };
      analyze(); renderImportPreview();
    });
  }
  // Zeilen zu Artikelgruppen zusammenfassen
  function analyze() {
    imp.files.forEach(F => {
      F.groups = []; F.error = ""; F.products = [];
      const { rows, hdr, map, fmt } = F;
      if (fmt.type === "etsyOrders") { F.error = "Diese Datei enthält nur Bestellungen ohne Artikelnamen. Lade bei Etsy „Bestellte Artikel“ herunter."; return; }
      if (fmt.type === "shopifyProducts") {
        const iT = hdr.indexOf("title"), iH = hdr.indexOf("handle"), iP = hdr.indexOf("variant price"), iG = hdr.indexOf("variant grams"), iS = hdr.indexOf("variant sku");
        const seen = {};
        rows.slice(1).forEach(r => { const h = r[iH]; if (!seen[h] && r[iT]) seen[h] = { name: r[iT].trim(), price: money(r[iP]), grams: iG >= 0 ? money(r[iG]) : NaN, sku: iS >= 0 ? (r[iS] || "").trim() : "" }; });
        F.products = Object.values(seen);
        F.groups = F.products.map(p => ({ key: norm(p.name), name: p.name, qty: 0, revenue: 0, avg: p.price, grams: p.grams, sku: p.sku, product: true }));
        return;
      }
      if (fmt.type === "etsyListings") {
        const iP = hdr.indexOf("price") >= 0 ? hdr.indexOf("price") : hdr.indexOf("preis");
        F.groups = rows.slice(1).filter(r => r[map.name]).map(r => ({ key: norm(r[map.name]), name: r[map.name].trim(), qty: 0, revenue: 0, avg: money(r[iP]), product: true }));
        return;
      }
      if (map.name < 0 || map.qty < 0) { F.error = "Spalten für Artikelname und Menge nicht gefunden. Ordne sie unten zu."; return; }
      const iStat = hdr.indexOf("financial status"), iOrd = hdr.indexOf("name");
      const statusByOrder = {};
      const g = {}; let from = null, to = null;
      rows.slice(1).forEach(r => {
        if (fmt.type === "shopifyOrders" && iStat >= 0 && iOrd >= 0) {
          if (r[iStat]) statusByOrder[r[iOrd]] = norm(r[iStat]);
          if (["refunded", "voided"].includes(statusByOrder[r[iOrd]])) return;
        }
        const name = (r[map.name] || "").trim(); if (!name) return;
        const q = money(r[map.qty]); if (!(q > 0)) return;
        const p = map.price >= 0 ? money(r[map.price]) : NaN;
        const varn = imp.split && map.variation >= 0 ? (r[map.variation] || "").trim() : "";
        const rowSku = map.sku >= 0 ? (r[map.sku] || "").trim() : "";
        const full = rowSku ? `${name} · ${rowSku}` : varn ? `${name} · ${varn}` : name, key = rowSku ? "sku:" + norm(rowSku) : norm(full);
        const x = g[key] || (g[key] = { key, name: full, qty: 0, revenue: 0, priced: 0 });
        if (!x.sku && map.sku >= 0 && r[map.sku]) x.sku = r[map.sku].trim();
        x.qty += q; if (isFinite(p)) { x.revenue += p * q; x.priced += q; }
        const d = map.date >= 0 ? pdate(r[map.date]) : null;
        if (d) { if (!from || d < from) from = d; if (!to || d > to) to = d; }
      });
      F.groups = Object.values(g).map(x => ({ ...x, avg: x.priced ? x.revenue / x.priced : NaN })).sort((x, y) => y.qty - x.qty);
      F.from = from; F.to = to;
      if (F.months == null) F.months = from && to ? Math.max(1, Math.round((to - from) / 864e5 / 30.44 * 10) / 10) : 1;
      if (!F.groups.length) F.error = "Keine verkauften Artikel gefunden.";
    });
    // Zuordnung: vorhandener Artikel per Name/Alias, sonst neu
    imp.files.forEach(F => F.groups.forEach(gr => {
      if (gr.target) return;
      const k = loose(gr.name);
      const bySku = gr.sku ? A.filter(a => norm(a.sku) === norm(gr.sku)) : [];
      const hit = (bySku.length === 1 ? bySku[0] : null)
        || A.find(a => loose(a.name) === k || (a.aliases || []).some(al => loose(al) === k))
        // ähnlicher Name: einer steckt im anderen („Untersetzer-Set Eiche“ ↔ „Untersetzer-Set Eiche, 4 Stück“)
        || A.find(a => { const n = loose(a.name); return n.length > 5 && k.length > 5 && (n.includes(k) || k.includes(n)); });
      gr.target = hit ? hit.id : "new";
    }));
  }
  function renderImportPreview() {
    const artOpts = sel => opt("new", "Neu anlegen", sel === "new") + opt("skip", "Ignorieren", sel === "skip") + A.map(a => opt(a.id, a.name, sel === a.id)).join("");
    const fd = d => d ? d.toLocaleDateString("de-DE") : "?";
    $("view").innerHTML = `
      <div class="row"><h1>Import prüfen</h1><div class="btns"><button class="btn" data-act="cancelImport">Abbrechen</button><button class="btn primary" data-act="applyImport">Übernehmen</button></div></div>
      <label class="check"><input type="checkbox" id="splitVar" ${imp.split ? "checked" : ""}> Varianten (Größe, Holzart …) als eigene Artikel</label>
      ${imp.files.map((F, fi) => `<section class="box">
        <div class="row"><h2>${esc(F.file)}</h2><span class="pill ${F.error ? "bad" : "good"}">${esc(F.fmt.label)}</span></div>
        ${F.fmt.type === "generic" || (F.error && F.fmt.type !== "etsyOrders") ? `<div class="grid3 keep">${["name", "qty", "price", "date"].map(k => `<div class="field"><label>${{ name: "Artikelname", qty: "Menge", price: "Preis pro Stück", date: "Datum" }[k]}</label><div class="inp"><select data-imap="${fi}" data-k="${k}">${opt("-1", "–", F.map[k] < 0)}${F.rawHdr.map((h, i) => opt(String(i), h, F.map[k] === i)).join("")}</select></div></div>`).join("")}
          <div class="field"><label>Kanal</label><div class="inp"><select data-ich="${fi}">${CHANNELS.map(c => opt(c, CH_NAMES[c], F.ch === c)).join("")}</select></div></div></div>` : ""}
        ${F.error ? `<p class="warn">${esc(F.error)}</p>` : `
          ${F.groups[0] && !F.groups[0].product ? `<div class="grid3 keep" style="align-items:end"><div class="field"><span class="label">Zeitraum</span><span class="num">${fd(F.from)} – ${fd(F.to)}</span></div>
            <div class="field"><label for="imon-${fi}">Entspricht Monaten</label>${numIn(`id="imon-${fi}" data-imon="${fi}"`, F.months, "Mon.")}</div>
            <div class="field"><span class="label">Verkauft gesamt</span><span class="num">${dec(F.groups.reduce((s, x) => s + x.qty, 0), 0)} Stk</span></div></div>` : `<p class="note">Produktliste: übernimmt Preise${F.fmt.type === "shopifyProducts" ? " und Gewichte" : ""}, keine Verkaufszahlen.</p>`}
          <div class="tablewrap"><table class="imp"><thead><tr><th>Gefunden</th><th>${F.groups[0] && F.groups[0].product ? "" : "Stk"}</th><th>Ø Preis</th><th>Zuordnung</th></tr></thead><tbody>
            ${F.groups.map((g, gi) => `<tr><td class="name">${esc(g.name)}</td><td class="num">${g.product ? "" : dec(g.qty, 0)}</td><td class="num">${eur(g.avg)}</td>
              <td><div class="inp" style="min-width:0"><select data-itgt="${fi}" data-g="${gi}" aria-label="Zuordnung für ${esc(g.name)}">${artOpts(g.target)}</select></div></td></tr>`).join("")}
          </tbody></table></div>`}
      </section>`).join("")}
      <p class="note">Mehrere Zeilen auf denselben Artikel legen fasst sie zusammen (z. B. Varianten). Bei jedem Artikel merkt sich die App den Namen aus dem Import und ordnet ihn beim nächsten Mal automatisch zu.</p>`;
    $("splitVar").addEventListener("change", e => { imp.split = e.target.checked; imp.files.forEach(F => F.groups = []); analyze(); renderImportPreview(); });
    document.querySelectorAll("[data-itgt]").forEach(s => s.addEventListener("change", () => { imp.files[+s.dataset.itgt].groups[+s.dataset.g].target = s.value; }));
    document.querySelectorAll("[data-imon]").forEach(s => s.addEventListener("input", () => { imp.files[+s.dataset.imon].months = v(s.value) || 1; }));
    document.querySelectorAll("[data-imap]").forEach(s => s.addEventListener("change", () => { const F = imp.files[+s.dataset.imap]; F.map[s.dataset.k] = +s.value; F.groups = []; F.months = null; analyze(); renderImportPreview(); }));
    document.querySelectorAll("[data-ich]").forEach(s => s.addEventListener("change", () => { imp.files[+s.dataset.ich].ch = s.value; }));
  }
  function applyImport() {
    let created = 0, updated = new Set();
    const acc = {};   // Artikel-ID → Kanal → Summen
    const newByKey = {};
    imp.files.forEach(F => {
      if (F.error) return;
      F.groups.forEach(g => {
        if (g.target === "skip") return;
        let a;
        if (g.target === "new") {
          a = newByKey[g.key];
          if (!a) {
            a = { ...ARTICLE_BLANK(), name: g.name, chan: F.ch, price: isFinite(g.avg) ? g.avg.toFixed(2) : "", aliases: [g.name], sku: g.sku || "" };
            if (isFinite(g.grams) && g.grams > 0) a.weight = String(Math.round(g.grams));
            A.push(a); newByKey[g.key] = a; created++;
          }
        } else {
          a = A.find(x => x.id === g.target); if (!a) return;
          if (norm(a.name) !== g.key && !(a.aliases || []).some(al => norm(al) === g.key)) (a.aliases = a.aliases || []).push(g.name);
          if (g.sku && !a.sku) a.sku = g.sku;
          if (g.product) { if (isFinite(g.avg)) a.price = g.avg.toFixed(2); if (isFinite(g.grams) && g.grams > 0 && !v(a.weight)) a.weight = String(Math.round(g.grams)); }
          updated.add(a.id);
        }
        if (g.product) return;
        const k = acc[a.id] = acc[a.id] || {};
        const c = k[F.ch] = k[F.ch] || { qty: 0, revenue: 0, priced: 0, months: 0, from: null, to: null };
        c.qty += g.qty; c.revenue += g.revenue; c.priced += g.priced || 0; c.months = Math.max(c.months, v(F.months) || 1);
        if (F.from && (!c.from || F.from < c.from)) c.from = F.from;
        if (F.to && (!c.to || F.to > c.to)) c.to = F.to;
      });
    });
    // Ein neuer Import ersetzt die Verkaufszahlen des Kanals bei allen Artikeln
    const chans = new Set(imp.files.filter(F => !F.error && F.groups.some(g => !g.product)).map(F => F.ch));
    A.forEach(a => {
      let ch = updated.has(a.id) || Object.values(newByKey).includes(a);
      chans.forEach(c => { if (a.sales && a.sales[c]) { delete a.sales[c]; ch = true; } });
      Object.entries(acc[a.id] || {}).forEach(([c, x]) => {
        (a.sales = a.sales || {})[c] = { qty: x.qty, months: x.months, avg: x.priced ? Math.round(x.revenue / x.priced * 100) / 100 : v(a.price),
          from: x.from ? x.from.toISOString().slice(0, 10) : "", to: x.to ? x.to.toISOString().slice(0, 10) : "" };
        ch = true;
      });
      if (ch) saveArticle(a);
    });
    imp = null;
    toast(`${created} Artikel neu angelegt, ${updated.size} aktualisiert`);
    go("uebersicht");
  }

  // ---------- Live-Abgleich ----------
  function liveArticles(changes) {
    if (!changes.length) return;
    changes.forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === "removed") { A = A.filter(a => a.id !== id); return; }
      const d = clone(ch.doc.data() || {}), i = A.findIndex(a => a.id === id);
      if (i >= 0) A[i] = d; else A.push(d);
    });
    liveRefresh();
  }
  function liveSettings(data) {
    if (!data) return;
    const next = { ...SETTINGS_DEFAULT(), ...clone(data) };
    if (JSON.stringify(next) === JSON.stringify(S)) return;
    S = next; liveRefresh();
  }
  function liveRefresh() {
    if (view === "uebersicht" && document.activeElement?.id !== "search") renderOverview();
    else if (view === "artikel" && !dirty) {
      const a = A.find(x => x.id === curId);
      if (a && JSON.stringify(a) !== JSON.stringify(draft)) { draft = clone(a); renderEditor(draft); }
    }
    else if (view === "einstellungen" && !dirty && JSON.stringify(S) !== JSON.stringify(draftS)) { draftS = clone(S); renderSettings(); }
  }

  // ---------- Start ----------
  async function boot() {
    store = Local; mode = "local";
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const db = await Promise.race([window.claude.use("db"), new Promise(r => setTimeout(() => r(null), 10000))]);
        if (db) { store = Cloud(db); mode = "cloud"; }
      } catch (e) {}
    }
    let data;
    try { data = await store.load(); }
    catch (e) { store = Local; mode = "local"; data = await Local.load(); toast("Online-Speicher nicht erreichbar, arbeite lokal."); }
    if (!data.settings && !data.articles.length) {
      // Erster Start: lokale Daten (gleicher Browser) oder Vorversion übernehmen
      let seed = mode === "cloud" ? await Local.load() : null;
      if (!seed || (!seed.settings && !seed.articles.length)) seed = migrateV2();
      if (seed && (seed.settings || seed.articles.length)) {
        S = { ...SETTINGS_DEFAULT(), ...(seed.settings || {}) }; A = seed.articles || [];
        saveSettings(); A.forEach(saveArticle);
        if (A.length) toast(`${A.length} Artikel aus der Vorversion übernommen`);
      }
    } else {
      S = { ...SETTINGS_DEFAULT(), ...(data.settings || {}) }; A = data.articles || [];
    }
    setSync("ok");
    route();
    if (store.subscribe) store.subscribe(liveArticles, liveSettings);
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !(window.claude)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  boot();
})();
</script>
</body>
