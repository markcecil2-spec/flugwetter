# Temporaere Diagnose: misst, wie die Overpass-Server auf die Umgebungs-Abfrage
# der Briefing-Karte antworten. Laeuft nur auf diesem Arbeits-Branch, wird danach geloescht.
name: overpass-diagnose
on:
  push:
    branches: [claude/goflytoday-app-not-working-oofhku]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Varianten messen
        run: |
          L="47.1829,9.7821"
          SMALL='[out:json][timeout:25];nwr["amenity"="parking"](around:3000,'$L');out center 50;'
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36'
          run() { echo "=== $1"; shift; curl -sS -o /tmp/o -D /tmp/h -w 'status=%{http_code} time=%{time_total}s size=%{size_download}\n' --max-time 25 "$@" || echo "curl failed"; grep -i 'access-control-allow-origin\|^retry-after' /tmp/h || echo "kein CORS"; head -c 200 /tmp/o | tr '\n' ' '; echo; }
          D=https://overpass-api.de/api/interpreter
          run "de POST ohne UA"        -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "data=$SMALL" $D
          run "de POST Browser-UA"     -A "$UA" -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "data=$SMALL" $D
          run "de POST UA+Referer+Origin" -A "$UA" -e 'https://goflytoday.de/' -H 'Origin: https://goflytoday.de' -H 'Accept: */*' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "data=$SMALL" $D
          run "de GET UA+Referer"      -A "$UA" -e 'https://goflytoday.de/' -G --data-urlencode "data=$SMALL" $D
          run "de GET App-UA"          -A 'GoFlyToday/1.0 (+https://goflytoday.de)' -G --data-urlencode "data=$SMALL" $D
          run "de status"              -A "$UA" https://overpass-api.de/api/status
          for u in https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.osm.ch/api/interpreter; do
            run "$u GET UA" -A "$UA" -e 'https://goflytoday.de/' -G --data-urlencode "data=$SMALL" $u
          done
          run "osm.ch status" -A "$UA" https://overpass.osm.ch/api/status
